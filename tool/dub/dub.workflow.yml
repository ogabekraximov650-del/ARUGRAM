name: Dublyaj (VoiceStudio, klon ovoz)

# Kodlash botining "Dublyaj" bo'limi (`worker/src/dubbot.rs`).
# Botga video yuborilsa ish bazadagi navbatga (`dub_jobs`) tushadi va worker shu workflow'ni o'zi ishga tushiradi
# (cron ham har 10 daqiqada tekshiradi). Bitta run — bitta video: yuklaydi, VoiceStudio (CPU) bilan ovozlarni klonlab, tarjima qilib
# dublyaj qiladi (kod ARUGRAM repodagi `tool/voicedub`), tayyor videoni kanalga yuklaydi; bot uni chatga ko'chiradi.
# Qo'lda tarjima rejimida avval matn (so'zlar vaqti bilan) yuboriladi, tarjima kelgach dublyaj; uzun video bo'laklab, kerak bo'lsa bir necha run'da.
# Foiz va bosqichlar botdagi bitta xabarda shu run'ning o'zidan yangilanib turadi.
# Navbatda yana ish qolsa yangi run ochiladi. Avto-kodlash, post, tarjima, siqish va anibla'dan ALOHIDA.
#
# Bu fayl ARUMEDIATV repodagi `tool/dub/dub.workflow.yml` dan ko'chiriladi
# (`sync-packs.yml`) — shu yerda o'zgartirmang.

on:
  workflow_dispatch: {}

concurrency:
  group: arumediatv-dub
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # "Davom ettirish": navbatda ish qolsa yangi run ochish

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      # VoiceStudio nusxasi shu ochiq repoda (`tool/voicedub`).
      SRC_REPO: ogabekraximov650-del/ARUGRAM
    steps:
      - name: Run boshlangan vaqt (6 soatlik chegara hisobi uchun)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Run boshlanganidan `dub.py` ishni olgunicha botdagi holat xabari shu yerdan yangilanadi (`tool/dub/ticker.sh`).
      - name: Jonli holat (bosqichlar)
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          echo "▶️ Run boshlandi — Actions serveri tayyor" > "$RUNNER_TEMP/stage.txt"
          nohup bash tool/dub/ticker.sh >/dev/null 2>&1 &

      - name: Bosqich — kod
        run: echo "📥 VoiceStudio kodi yuklanmoqda (ARUGRAM/tool/voicedub)" > "$RUNNER_TEMP/stage.txt"

      - name: VoiceStudio kodi (ARUGRAM/tool/voicedub)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          path: arugram
          sparse-checkout: tool/voicedub
          fetch-depth: 1

      - name: Tizim paketlari
        run: |
          echo "🔧 Tizim paketlari o'rnatilmoqda (ffmpeg, espeak)" > "$RUNNER_TEMP/stage.txt"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python paketlari (Telegram)
        run: |
          echo "🐍 Python va Telegram paketlari o'rnatilmoqda" > "$RUNNER_TEMP/stage.txt"
          pip install --no-cache-dir -r tool/encode/requirements.txt

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Bosqich — kesh
        run: echo "💾 Modellar keshi tiklanmoqda (6 GB gacha)" > "$RUNNER_TEMP/stage.txt"

      - name: Modellar keshi
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voicestudio-v4

      - name: VoiceStudio muhiti (CPU torch)
        working-directory: arugram/tool/voicedub/voicestudio
        env:
          UV_HTTP_TIMEOUT: '120'
          UV_HTTP_RETRIES: '6'
        run: |
          echo "📦 VoiceStudio muhiti o'rnatilmoqda (CPU torch, ~2 daqiqa)" > "$RUNNER_TEMP/stage.txt"
          uv sync --locked --no-group cuda --group cpu
          uv pip install --python .venv/bin/python deep-translator

      - name: Modellar (Hugging Face)
        working-directory: arugram/tool/voicedub/voicestudio
        run: |
          echo "🧠 Modellar yuklanmoqda: OmniVoice, Whisper, NLLB (~6 GB; birinchi marta 3–5 daqiqa)" > "$RUNNER_TEMP/stage.txt"
          uv run --no-sync python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo in ("k2-fsa/OmniVoice", "eustlb/higgs-audio-v2-tokenizer", "Systran/faster-whisper-small", "facebook/nllb-200-distilled-1.3B"):
              print("model:", repo, "->", snapshot_download(repo), flush=True)
          PY

      - name: Telegram sessiyasi (asosiy akkaunt)
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          echo "🔑 Telegram sessiyasi tiklanmoqda" > "$RUNNER_TEMP/stage.txt"
          OUT=tool/dub/pyro_session.session
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
            -in tool/encode/session.enc -out "$OUT"
          head -c 16 "$OUT" | grep -q "SQLite format 3" || { echo "::error::Sessiya ochilmadi (ENCODE_TOKEN noto'g'ri?)"; exit 1; }
          echo "Sessiya tiklandi"

      - name: VoiceStudio backend
        working-directory: arugram/tool/voicedub/voicestudio
        env:
          OMNIVOICE_DATA_DIR: ${{ runner.temp }}/ov_data
        run: |
          echo "🚀 VoiceStudio backend ishga tushmoqda (modellar xotiraga yuklanadi)" > "$RUNNER_TEMP/stage.txt"
          nohup uv run --no-sync uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:8000/health >/dev/null; then echo "backend tayyor"; exit 0; fi
            sleep 3
          done
          echo "backend ishga tushmadi"; tail -n 60 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Navbatdagi videoni dublyaj qilish
        id: dub
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          WORK_ROOT: ${{ runner.temp }}
          VD_DIR: ${{ github.workspace }}/arugram/tool/voicedub
          VS_MODELS: k2-fsa/OmniVoice,eustlb/higgs-audio-v2-tokenizer,Systran/faster-whisper-small
          # Tarjima VoiceStudio'dan tashqarida: tool/voicedub/translate.py (NLLB 1.3B distilled — sinovda 600M'dan aniq yaxshi).
          NLLB_MODEL: facebook/nllb-200-distilled-1.3B
          # Uzun video bo'laklab ishlanadi (har bo'lak ~PART_S soniya, gap chegarasida).
          PART_S: '300'
          # Sifat/tezlik: CPU'da 24 qadam (standart 16, "sifatli" 32).
          VS_NUM_STEP: '24'
          VS_EFFECT: raw
          OMNIVOICE_DATA_DIR: ${{ runner.temp }}/ov_data
          PYTHONUNBUFFERED: '1'
        run: |
          touch "$RUNNER_TEMP/stage.done"   # endi foiz xabarini dub.py o'zi yangilaydi
          python3 tool/dub/dub.py

      - name: Backend logi (xatoda)
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/backend.log" || true

      # Run xato bilan to'xtasa botdagi holat xabari ham shuni ko'rsatadi (ish navbatda qoladi, cron qayta urinadi).
      - name: Xato haqida botga xabar
        if: failure()
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          touch "$RUNNER_TEMP/stage.done"; sleep 2
          MSG="❌ Actions run xato bilan to'xtadi. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"$'\n'"Ish navbatda qoldi — taxminan 10 daqiqada qayta urinadi."
          jq -n --arg t "$MSG" '{text: $t}' | curl -fsS -m 20 -X POST -H "X-Encode-Token: $ENCODE_TOKEN" -H "User-Agent: arumediatv-dub" \
            -H "Content-Type: application/json" -d @- "$API_BASE/api/dub/stage" || true

      - name: Sessiyani o'chirish
        if: always()
        run: rm -f tool/dub/pyro_session.session

      # Bitta run — bitta video. Navbatda yana ish qolgan bo'lsa, keyingi cron'ni kutmasdan yangi run ochiladi.
      - name: Davom ettirish
        if: success() && steps.dub.outputs.worked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          N=$(curl -fsS -X POST -H "X-Encode-Token: $ENCODE_TOKEN" -H "User-Agent: arumediatv-dub" \
            -H "Content-Type: application/json" -d '{}' "$API_BASE/api/dub/peek" | jq -r '.pending // 0')
          echo "Qolgan videolar: $N"
          if [ "$N" != "0" ]; then gh workflow run dub.yml --repo "$GITHUB_REPOSITORY"; fi
