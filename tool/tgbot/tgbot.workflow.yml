name: ARUDRIVE qabul boti (Telegram -> R2)

# Botga (`@arudrivebot`) forward qilingan video/fayl sessiya orqali yuklab olinadi, R2 ga yuboriladi (worker faqat havola beradi),
# keyin worker Telegram kanaliga saqlaydi. Run xabar bo'lguncha ishlaydi (vaqt chegarasi yo'q, faqat GitHub'ning 6 soatlik
# chegarasi), navbat bo'shagach ~2 daqiqa kutib o'zi o'chadi. `concurrency`: bir vaqtda BITTA run. Bot o'chiq paytdagi
# xabarlar keyingi run boshida chat tarixidan olinadi (hech narsa yo'qolmaydi).
on:
  # Faqat worker uyg'otadi: botga xabar kelsa Telegram webhook -> worker (`/api/tg/hook`) -> shu workflow (`workflow_dispatch`).
  # Ishlab turganda yana uyg'otilmaydi. Xabar bo'lmasa hech narsa ishlamaydi (cron YO'Q).
  workflow_dispatch: {}

concurrency:
  group: arudrive-tgbot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BD_API: ${{ secrets.BD_API || 'https://arudrive.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg (kichik rasm uchun zaxira)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python paketlari
        run: pip install --no-cache-dir -r tool/tgbot/requirements.txt

      - name: Sessiya va bot tokeni
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          if [ -z "$ENCODE_TOKEN" ]; then echo "::error::ENCODE_TOKEN secret'i yo'q"; exit 1; fi
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          # Alohida sessiya (`tool/tgbot/session.enc`) bo'lsa o'sha (boshqa jarayonlar bilan bir vaqtda ishlatish xavfsizroq),
          # bo'lmasa umumiy `tool/encode/session.enc`.
          SRC=tool/encode/session.enc
          [ -f tool/tgbot/session.enc ] && SRC=tool/tgbot/session.enc
          echo "Sessiya manbasi: $SRC"
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$SRC" -out "$RUNNER_TEMP/tgbot.session"
          head -c 16 "$RUNNER_TEMP/tgbot.session" | grep -q "SQLite format 3" || { echo "::error::Sessiya ochilmadi"; exit 1; }
          BT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/tgbot/bot.enc | tr -d '[:space:]')
          [ -n "$BT" ] || { echo "::error::Bot tokeni ochilmadi"; exit 1; }
          echo "::add-mask::$BT"
          echo "BOT_TOKEN=$BT" >> "$GITHUB_ENV"

      - name: Bot (xabar bo'lguncha, keyin o'zi o'chadi)
        id: bot
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION: ${{ runner.temp }}/tgbot
          RUN_MIN: '335'
          IDLE_EXIT: '120'
        run: python3 tool/tgbot/bot.py

      - name: Sessiyani o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/tgbot.session"

      # GitHub bitta run'ni 6 soatda to'xtatadi: shu vaqtgacha ishlanmagan fayl qolgan bo'lsa — o'zini qayta ishga tushiradi.
      - name: Davom ettirish
        if: steps.bot.outputs.leftover == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tgbot.yml --repo "$GITHUB_REPOSITORY"
