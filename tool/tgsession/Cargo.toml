[package]
name = "tgsession"
version = "0.1.0"
edition = "2021"

# ARUGRAM yadrosidagi (`ARUmultiplatform/ARUGRAM/rust`) bilan AYNAN bir xil grammers versiyalari: sessiya shu yadro o'qiy oladigan formatda yoziladi.
[dependencies]
serde_json = "1"
grammers-client = { version = "=0.10.0", default-features = false }
grammers-mtsender = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-crypto = "=0.10.0"
glass_pumpkin = "=2.0.0-rc0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
