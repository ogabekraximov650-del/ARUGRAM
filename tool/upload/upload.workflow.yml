name: R2 -> Telegram yuklovchi

# Kodlovchi workflow'lar tayyor faylni Cloudflare R2'ga yozadi; bu workflow ularni R2'dan olib asosiy botga yuboradi
# (bot yopiq kanalga saqlab bazaga yozadi, keyin fayl R2'dan o'chadi). `tool/upload/upload.py`, `worker/src/r2.rs`.
# Worker o'zi ishga tushiradi (fayl R2'da tayyor bo'lganda va cron). Bir vaqtda faqat BITTA run.
#
# Bu fayl ARUGRAM repodagi `tool/upload/upload.workflow.yml` dan ko'chiriladi (`sync-packs.yml`) — shu yerda o'zgartirmang.

on:
  workflow_dispatch: {}

concurrency:
  group: arugram-upload
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE: ${{ secrets.API_BASE || 'https://arugram.uzcom.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python paketlari
        run: pip install --no-cache-dir -r tool/encode/requirements.txt

      - name: Telegram sessiyasi
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          OUT=tool/upload/pyro_session.session
          # Telegram'ga yuklash ESKI umumiy sessiya bilan (kodlovchilarning sessiyalari alohida).
          SRC=tool/encode/session.enc
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$SRC" -out "$OUT"
          head -c 16 "$OUT" | grep -q "SQLite format 3" || { echo "::error::Sessiya ochilmadi (ENCODE_TOKEN noto'g'ri?)"; exit 1; }
          # Qo'shimcha sessiyalar (botdagi "🗂 Yuklovchi sessiyalar"): FloodWait'da almashish uchun.
          for F in tool/encode/pool/*.enc; do
            [ -f "$F" ] || continue
            P="tool/upload/pool_$(basename "$F" .enc).session"
            if K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$F" -out "$P" && head -c 16 "$P" | grep -q "SQLite format 3"; then
              echo "qo'shimcha sessiya: $F"
            else
              rm -f "$P"; echo "::warning::$F ochilmadi"
            fi
          done

      - name: R2 -> Telegram
        id: up
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          START_BUDGET_MIN: '55'
          PYTHONUNBUFFERED: '1'
        run: python3 tool/upload/upload.py

      - name: Sessiyani o'chirish
        if: always()
        run: rm -f tool/upload/pyro_session.session tool/upload/pool_*.session

      # Har run BITTA sifatni (MP4 va fMP4) Telegram'ga yetkazib o'chadi; R2'da fayl qolgan bo'lsa — yangi run ochiladi.
      - name: Davom ettirish
        if: success() && steps.up.outputs.worked == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          N=$(curl -fsS -X POST -H "X-Encode-Token: $ENCODE_TOKEN" -H "Content-Type: application/json" -d '{}' \
            -H "User-Agent: arugram-upload" "$API_BASE/api/r2/peek" | jq -r '.pending // 0')
          echo "R2'da qolgan: $N"
          if [ "$N" != "0" ]; then gh workflow run upload.yml --repo "$GITHUB_REPOSITORY"; fi
