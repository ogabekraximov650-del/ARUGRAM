name: Anibla -> aniraxuzbot (__Q__)

# aniraxuzbot ("➕ Yangi qism qo'shish" -> "🌐 Anibla orqali"): har bir sifat uchun ALOHIDA workflow fayli
# (`anibla_bot_1080p.yml`, `anibla_bot_720p.yml`, `anibla_bot_480p.yml`, `anibla_bot_360p.yml`) — hammasi shu shablondan
# `tool/packs/sync_repo.py` tomonidan yaratiladi (`__Q__` o'rniga sifat qo'yiladi). Shu workflow'ning run'i bitta sifatni
# yuklaydi, 2 GB dan katta bo'lsa qayta kodlamasdan aniq o'lchab qismlarga bo'ladi va botga yuboradi (`tool/anibla/bot_download.py`).
# Bot videoni yopiq kanalga saqlab, `file_id` ni bazaga yozadi. Run tugagach o'chadi (navbat yo'q, har sifat — bitta run).
#
# Bu fayl ARUMEDIATV repodagi `tool/anibla/anibla_bot.workflow.yml` dan ko'chiriladi (`sync-packs.yml`) — shu yerda o'zgartirmang.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Bot ish raqami"
        required: true
      token:
        description: "Bot ish tokeni"
        required: true
      bot:
        description: "Bot username (@siz)"
        required: true
      quality:
        description: "Sifat (1080p/720p/480p/360p)"
        required: true
      video:
        description: "HLS video playlist manzili"
        required: true
      audio:
        description: "Alohida ovoz playlisti (ixtiyoriy)"
        required: false
        default: ''
      name:
        description: "Fayl nomi"
        required: false
        default: ''
      api:
        description: "Bot worker manzili (jonli holat uchun)"
        required: false
        default: ''

run-name: "Anibla #${{ inputs.job }} · ${{ inputs.quality }}"

concurrency:
  group: aniraxuzbot-anibla-__Q__-${{ inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Maxfiylarni yashirish
        run: echo "::add-mask::${{ inputs.token }}"

      - uses: actions/checkout@v4

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python paketlari
        run: pip install --no-cache-dir -r tool/encode/requirements.txt

      - name: Telegram sessiyalari (qo'shimcha akkauntlar)
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          # ASOSIY akkaunt ishlatilmaydi: faqat botdagi "🗂 Yuklovchi sessiyalar" (tool/encode/pool/*.enc).
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          N=0
          for F in tool/encode/pool/*.enc; do
            [ -f "$F" ] || continue
            P="tool/anibla/pool_$(basename "$F" .enc).session"
            if K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$F" -out "$P" && head -c 16 "$P" | grep -q "SQLite format 3"; then
              echo "sessiya: $F"; N=$((N+1))
            else
              rm -f "$P"; echo "::warning::$F ochilmadi"
            fi
          done
          [ "$N" -gt 0 ] || { echo "::error::Qo'shimcha sessiya yo'q — panel botda 'Yuklovchi sessiyalar' orqali qo'shing"; exit 1; }

      - name: Katta fayllar uchun joy (/mnt dagi katta disk)
        run: |
          sudo mkdir -p /mnt/anibla && sudo chown "$USER" /mnt/anibla
          df -h /mnt/anibla | tail -1

      - name: Yuklash, kerak bo'lsa bo'lish va botga yuborish
        env:
          WORK_ROOT: /mnt/anibla
          JOB: ${{ inputs.job }}
          TOKEN: ${{ inputs.token }}
          BOT: ${{ inputs.bot }}
          QUALITY: ${{ inputs.quality }}
          VIDEO: ${{ inputs.video }}
          AUDIO: ${{ inputs.audio }}
          NAME: ${{ inputs.name }}
          API: ${{ inputs.api }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PYTHONUNBUFFERED: '1'
        run: python3 tool/anibla/bot_download.py

      - name: Xatoni botga bildirish
        if: failure()
        env:
          JOB: ${{ inputs.job }}
          TOKEN: ${{ inputs.token }}
          API: ${{ inputs.api }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$API" ] || exit 0
          curl -sS -m 20 -X POST "${API%/}/anibla/fail" -H 'Content-Type: application/json' \
            -d "{\"job\": ${JOB}, \"token\": \"${TOKEN}\", \"error\": \"Actions run yiqildi: ${RUN_URL}\"}" || true

      - name: Sessiyani o'chirish
        if: always()
        run: rm -f tool/anibla/pool_*.session
