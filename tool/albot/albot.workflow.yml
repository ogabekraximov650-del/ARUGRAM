name: albot (mahalliy AI modeli)

# albot boti: botga javob beradigan mahalliy model (llama.cpp + gpt-oss-20b, CPU) shu run'da ishlaydi.
# Run'ni FAQAT albot worker'i ishga tushiradi (`workflow_dispatch`): bazada modelga o'qilmagan/javobsiz xabar bo'lsa.
# Run kutib turmaydi (polling yo'q): navbatdagi xabarlarga javob berib bo'lgach o'zi to'xtaydi; ko'pi bilan 1 soat.
#
# Bu fayl ARUMEDIATV repodagi `tool/albot/albot.workflow.yml` dan ko'chiriladi (`sync-packs.yml`) — shu yerda o'zgartirmang.

on:
  workflow_dispatch:

run-name: "albot · model"

concurrency:
  group: albot-model
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Joy va swap (/mnt)
        run: |
          sudo mkdir -p /mnt/albot && sudo chown "$USER" /mnt/albot
          sudo fallocate -l 8G /mnt/albot/swap && sudo chmod 600 /mnt/albot/swap
          sudo mkswap /mnt/albot/swap >/dev/null && sudo swapon /mnt/albot/swap
          free -h | head -2; df -h /mnt/albot | tail -1

      - name: llama.cpp (tayyor CPU build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api repos/ggml-org/llama.cpp/releases/latest --jq '.assets[].browser_download_url' > /tmp/assets.txt
          URL=$(grep -E 'ubuntu-x64\.(zip|tar\.gz)$' /tmp/assets.txt | grep -viE 'vulkan|rocm|openvino|sycl|cuda|arm' | head -1)
          [ -n "$URL" ] || URL=$(grep -iE 'linux-x64|ubuntu.*x64' /tmp/assets.txt | grep -viE 'vulkan|rocm|openvino|sycl|cuda|arm' | head -1)
          echo "build: $URL"
          if [ -z "$URL" ]; then echo "llama.cpp CPU build topilmadi. Bor fayllar:"; grep -i linux /tmp/assets.txt | head; exit 1; fi
          mkdir -p /mnt/albot/llama && cd /mnt/albot/llama
          curl -fsSL --retry 4 -o pkg "$URL"
          case "$URL" in
            *.zip) unzip -q pkg ;;
            *) tar xzf pkg ;;
          esac
          BIN=$(find /mnt/albot/llama -name llama-server -type f | head -1)
          test -n "$BIN" && chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"

      - name: Model (gpt-oss-20b MXFP4, ~12 GB)
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 5 -C - -o /mnt/albot/model.gguf \
            https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf
          ls -la /mnt/albot/model.gguf

      - name: Model ishlaydi (xabarlarni kutadi)
        env:
          API: https://albot.uzcom.workers.dev
          RUN_KEY: ${{ secrets.ENCODE_TOKEN }}
          MODEL_PATH: /mnt/albot/model.gguf
          MAX_MIN: '42'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: python3 tool/albot/run.py 2>&1 | tee /tmp/albot_run.log

      # Run yiqilsa/bekor bo'lsa worker'ga sabab bilan aytiladi ("run bor" belgisi o'chadi; sabab botda ko'rinadi).
      - name: Worker'ga xabar (xatoda)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ secrets.ENCODE_TOKEN }}
        run: |
          STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                 --jq '[.jobs[].steps[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .name] | join(", ")' 2>/dev/null || true)
          TAIL=$(tail -c 700 /tmp/albot_run.log 2>/dev/null || true)
          LL=$(tail -c 500 /tmp/llama.log 2>/dev/null || true)
          STEP="$STEP" TAIL="$TAIL" LL="$LL" python3 - <<'PY' | curl -sS -m 30 -X POST \
            -H "X-Run-Key: $(printf '%s' "$RUN_KEY" | tr -d '[:space:]')" -H 'Content-Type: application/json' -d @- \
            https://albot.uzcom.workers.dev/ai/done || true
          import json, os
          print(json.dumps({"ok": False, "err": f"Qadam: {os.environ['STEP']}\n{os.environ['TAIL']}\n{os.environ['LL']}"[:1500]}))
          PY
