name: albot (mahalliy AI modeli)

# albot boti: botga javob beradigan mahalliy model (llama.cpp + gpt-oss-20b, CPU) shu run'da ishlaydi.
# Run'ni FAQAT albot worker'i ishga tushiradi (`workflow_dispatch`): bazada modelga o'qilmagan/javobsiz xabar bo'lsa.
# Run kutib turmaydi (polling yo'q): navbatdagi xabarlarga javob berib bo'lgach o'zi to'xtaydi; ko'pi bilan 1 soat.
#
# Bu fayl ARUMEDIATV repodagi `tool/albot/albot.workflow.yml` dan ko'chiriladi (`sync-packs.yml`) — shu yerda o'zgartirmang.

on:
  workflow_dispatch:

run-name: "albot · model"

concurrency:
  group: albot-model
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # persist-credentials: false — model buyruqlari repo tokenini (.git/config) o'qiy olmasin.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Model buyruqlari ALOHIDA oddiy foydalanuvchi (`albot`) sifatida, maxfiy kalitlarsiz ishlaydi: RUN_KEY va tokenlar
      # run.py jarayonining muhitida, `albot` ularni (boshqa foydalanuvchi bo'lgani uchun) ko'ra olmaydi.
      - name: Vositalar uchun muhit (foydalanuvchi, ffmpeg)
        run: |
          sudo useradd -m -s /bin/bash albot
          sudo mkdir -p /mnt/albot/work && sudo chown albot:albot /mnt/albot/work && sudo chmod 755 /mnt/albot /mnt/albot/work
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils >/dev/null
          python3 -m pip --version

      - name: Joy va swap (/mnt)
        run: |
          sudo mkdir -p /mnt/albot && sudo chown "$USER" /mnt/albot
          sudo fallocate -l 8G /mnt/albot/swap && sudo chmod 600 /mnt/albot/swap
          sudo mkswap /mnt/albot/swap >/dev/null && sudo swapon /mnt/albot/swap
          free -h | head -2; df -h /mnt/albot | tail -1

      # llama-server (~4-5 daqiqa yig'iladi) keshlanadi: keyingi run'larda tayyor binar olinadi. Model (12 GB) keshga sig'maydi (limit 10 GB).
      - name: llama-server keshi
        id: llcache
        uses: actions/cache@v4
        with:
          path: /mnt/albot/llama-cache
          key: llama-server-ubuntu-x64-v2

      - name: llama.cpp (kesh, tayyor CPU build, bo'lmasa manbadan yig'iladi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a /tmp/albot_setup.log) 2>&1
          if [ -x /mnt/albot/llama-cache/llama-server ]; then
            BIN=/mnt/albot/llama-cache/llama-server
            if LD_LIBRARY_PATH=/mnt/albot/llama-cache "$BIN" --version >/dev/null 2>&1; then
              echo "llama-server keshdan olindi"
              echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
              echo "LD_LIBRARY_PATH=/mnt/albot/llama-cache" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "kesh binari ishlamadi — qayta yig'iladi"
            rm -rf /mnt/albot/llama-cache
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1 unzip >/dev/null || true
          mkdir -p /mnt/albot/llama && cd /mnt/albot/llama
          BIN=""
          # 1) Tayyor CPU build (release fayllari ro'yxatidan nomi bo'yicha tanlanadi).
          if curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -o /tmp/rel.json \
               https://api.github.com/repos/ggml-org/llama.cpp/releases/latest; then
            URL=$(python3 - <<'PY'
          import json, re
          d = json.load(open('/tmp/rel.json'))
          names = [(a['name'], a['browser_download_url']) for a in d.get('assets', [])]
          print('tag:', d.get('tag_name'), '| fayllar:', ', '.join(n for n, _ in names if 'ubuntu' in n or 'linux' in n)[:600], file=__import__('sys').stderr)
          bad = re.compile(r'vulkan|rocm|openvino|sycl|cuda|arm|aarch|s390|riscv|ppc', re.I)
          ok = [u for n, u in names if re.search(r'(ubuntu|linux).*x64', n, re.I) and re.search(r'\.(zip|tar\.gz)$', n) and not bad.search(n)]
          print(ok[0] if ok else '')
          PY
            )
            echo "build: ${URL:-yoq}"
            if [ -n "$URL" ]; then
              curl -fsSL --retry 4 -o pkg "$URL"
              case "$URL" in *.zip) unzip -q -o pkg ;; *) tar xzf pkg ;; esac
              BIN=$(find /mnt/albot/llama -name llama-server -type f | head -1)
              if [ -n "$BIN" ]; then
                chmod +x "$BIN"
                if ! LD_LIBRARY_PATH="$(dirname "$BIN")" "$BIN" --version >/dev/null 2>&1; then
                  echo "tayyor build ishga tushmadi:"; LD_LIBRARY_PATH="$(dirname "$BIN")" "$BIN" --version 2>&1 | tail -3
                  BIN=""
                fi
              fi
            fi
          fi
          # 2) Zaxira: manbadan yig'ish (~6-10 daqiqa).
          if [ -z "$BIN" ]; then
            echo "manbadan yig'ilmoqda..."
            sudo apt-get install -y -qq cmake build-essential git >/dev/null
            git clone --depth 1 https://github.com/ggml-org/llama.cpp /mnt/albot/llama-src
            # -march=native EMAS: keshlangan binar boshqa CPU'li mashinada (AVX512 yo'q) SIGILL bilan yiqilardi. AVX2 hamma runner'da bor.
            cmake -S /mnt/albot/llama-src -B /mnt/albot/llama-src/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
              -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF >/dev/null
            cmake --build /mnt/albot/llama-src/build --target llama-server -j"$(nproc)" 2>&1 | tail -5
            BIN=/mnt/albot/llama-src/build/bin/llama-server
          fi
          test -x "$BIN" || { echo "llama-server topilmadi"; exit 1; }
          # Keyingi run'lar uchun: binar va uning kutubxonalari kesh papkasiga (run muvaffaqiyatli tugasa saqlanadi).
          mkdir -p /mnt/albot/llama-cache && cp -a "$(dirname "$BIN")"/. /mnt/albot/llama-cache/ 2>/dev/null || true
          rm -rf /mnt/albot/llama-cache/test-* /mnt/albot/llama-cache/llama-bench /mnt/albot/llama-cache/llama-cli 2>/dev/null || true
          du -sh /mnt/albot/llama-cache | tail -1
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"
          echo "llama-server: $BIN"

      - name: Model (gpt-oss-20b MXFP4, ~12 GB)
        run: |
          exec > >(tee -a /tmp/albot_setup.log) 2>&1
          set -e
          curl -fL --retry 5 --retry-delay 5 -C - -o /mnt/albot/model.gguf \
            https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf
          ls -la /mnt/albot/model.gguf

      - name: Model ishlaydi (xabarlarni kutadi)
        env:
          API: https://albot.uzcom.workers.dev
          RUN_KEY: ${{ secrets.ENCODE_TOKEN }}
          MODEL_PATH: /mnt/albot/model.gguf
          AGENT_WORKDIR: /mnt/albot/work
          MAX_MIN: '42'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: python3 tool/albot/run.py 2>&1 | tee /tmp/albot_run.log

      # Run yiqilsa/bekor bo'lsa worker'ga sabab bilan aytiladi ("run bor" belgisi o'chadi; sabab botda ko'rinadi).
      - name: Worker'ga xabar (xatoda)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ secrets.ENCODE_TOKEN }}
        run: |
          STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                 --jq '[.jobs[].steps[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .name] | join(", ")' 2>/dev/null || true)
          TAIL=$(tail -c 700 /tmp/albot_run.log 2>/dev/null || true)
          LL=$(tail -c 1000 /tmp/albot_setup.log 2>/dev/null || true)
          LL="$LL
          $(tail -c 500 /tmp/llama.log 2>/dev/null || true)
          dmesg: $(sudo dmesg 2>/dev/null | grep -iE 'oom|killed process|invalid opcode|segfault|trap' | tail -3 || true)
          cpu: $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null || true) | $(free -m | awk 'NR==2{print "RAM "$2" MB, bo\x27sh "$7}')"
          STEP="$STEP" TAIL="$TAIL" LL="$LL" python3 - <<'PY' | curl -sS -m 30 -X POST \
            -H "X-Run-Key: $(printf '%s' "$RUN_KEY" | tr -d '[:space:]')" -H 'Content-Type: application/json' -d @- \
            https://albot.uzcom.workers.dev/ai/done || true
          import json, os
          print(json.dumps({"ok": False, "err": f"Qadam: {os.environ['STEP']}\n{os.environ['TAIL']}\n{os.environ['LL']}"[-1500:]}))
          PY
