<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>ARUMEDIATV — ilova haqida video</title>
<style>
:root{
  --bg:#0A0A0C; --surface:#101012; --card:#151517; --cardalt:#1B1B1E;
  --accent:#C2410C; --accent2:#E2620F; --gold:#FFC93C; --tint:#281914;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.10);
  --text:#F2F2F3; --dim:#9A9AA0; --faint:#6B6B70; --ok:#4ADE80; --bad:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#050507;font-family:'Inter','Roboto','Noto Sans','DejaVu Sans',sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1200px 700px at 70% 30%,#14100e 0%,#08080a 60%,#050507 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28}
#progress{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}

/* ───────── Telefon ───────── */
#phone{position:absolute;left:88px;top:24px;width:326px;height:672px;border-radius:46px;background:#000;border:2px solid #2b2b31;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 6px #0c0c0f,0 0 60px rgba(194,65,12,.12)}
#screen{position:absolute;left:10px;top:12px;width:306px;height:648px;border-radius:34px;overflow:hidden;background:var(--bg)}
#ui{position:absolute;left:0;top:0;width:360px;height:762px;transform:scale(.85);transform-origin:0 0;background:var(--bg);overflow:hidden}
.scr{position:absolute;left:0;top:0;width:360px;height:762px;background:var(--bg);overflow:hidden}
.sb{position:absolute;left:0;top:0;width:360px;height:28px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:600;color:#fff;pointer-events:none}
.sb .r{display:flex;gap:6px;align-items:center}
.batt{width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:#4ADE80;border-radius:1px}
.logo{font-weight:900;letter-spacing:0;white-space:nowrap}
.logo b{color:var(--accent2);font-weight:900}
.btn{background:var(--accent);border-radius:16px;padding:16px 0;text-align:center;font-weight:700;font-size:16px;color:#fff}
.field{position:relative;height:56px;border-radius:14px;border:1px solid var(--border2)}
.field .lab{position:absolute;left:16px;top:17px;font-size:16px;color:var(--dim);transition:none;white-space:nowrap}
.field .val{position:absolute;left:16px;top:17px;font-size:16px;color:#fff;white-space:pre;letter-spacing:.2px}
.field.float .lab{top:-9px;left:12px;font-size:12px;padding:0 4px;background:var(--bg);color:var(--dim)}
.field.focus{border:2px solid var(--accent2)}
.field.focus.float .lab{color:var(--accent2)}
.caret{display:inline-block;width:2px;height:20px;background:var(--accent2);vertical-align:-4px;margin-left:1px}
.link{color:var(--accent2);font-size:14px;text-align:center}
.small{color:var(--faint);font-size:12px;line-height:16px}

/* Bosh sahifa */
.card{position:absolute;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:var(--card)}
.card .cover{position:absolute;inset:0}
.card .letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:rgba(255,255,255,.16)}
.badge{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.55);border-radius:10px;padding:4px 8px;font-size:10.5px;font-weight:700}
.card .bot{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.65) 45%,rgba(0,0,0,.88))}
.card .bot .t{font-size:11px;font-weight:600}
.card .bot .n{font-size:14px;font-weight:700;line-height:17px}
#nav{position:absolute;left:16px;right:16px;bottom:12px;height:74px;border-radius:28px;background:var(--surface);border:1px solid var(--border);padding:10px 6px;box-shadow:0 12px 30px rgba(0,0,0,.7)}
#navpill{position:absolute;top:10px;height:52px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(194,65,12,.45)}
.navit{position:absolute;top:10px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.navit svg{width:22px;height:22px;fill:#fff}
.navit span{font-size:9px;font-weight:600;overflow:hidden;white-space:nowrap}

/* Bo'lim sahifasi */
.hdrback{background:var(--card);border:1px solid var(--border);border-radius:14px;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.video{position:absolute;left:16px;top:88px;width:328px;height:184.5px;border-radius:16px;overflow:hidden;background:#000}
.vscene{position:absolute;inset:0}
.vctl{position:absolute;inset:0}
.infochip{position:absolute;left:16px;top:278.5px;border-radius:11px;background:var(--card);border:1px solid var(--border);padding:5px 10px;display:flex;gap:10px;align-items:center;font-size:10.5px;white-space:nowrap}
.infochip .s{display:flex;gap:3px;align-items:center;color:rgba(255,255,255,.62)}
.infochip svg{width:11.5px;height:11.5px;fill:rgba(255,255,255,.45)}
.tabs{position:absolute;left:16px;width:328px;height:38px;border-radius:14px;background:var(--card);border:1px solid var(--border);padding:3px;display:flex}
.tabs div{flex:1;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.54)}
.tabs div.on{background:var(--accent);color:#fff;font-weight:600}
.ep{position:absolute;left:16px;width:328px;height:72px;border-radius:16px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;padding-left:12px}
.ep.cur{background:var(--tint);border-color:rgba(194,65,12,.5)}
.ep .num{width:48px;height:48px;border-radius:13px;background:var(--cardalt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.ep.cur .num{background:var(--accent)}
.ep .tx{margin-left:12px;flex:1}
.ep .tx b{display:block;font-size:15.5px}
.ep .tx i{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.ep.cur .tx b{color:var(--accent2)}
.ep .dl{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.ep .dl svg{width:24px;height:24px;fill:rgba(255,255,255,.6)}

/* Sozlamalar */
.ovhdr{position:absolute;left:16px;right:16px;top:40px;height:78px;border-radius:20px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px}
.ovhdr .bk{width:40px;height:40px;border-radius:14px;background:var(--cardalt);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.ovhdr b{font-size:22px}
.sec{color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:1.2px}
.swrow{position:absolute;left:16px;right:16px;height:62px;border-radius:16px;background:var(--card);border:1px solid var(--border);padding:10px 10px 10px 16px;display:flex;align-items:center}
.swrow .tt b{display:block;font-size:15px;font-weight:600}
.swrow .tt i{display:block;font-style:normal;font-size:12px;color:var(--dim);line-height:16px;margin-top:2px}
.sw{width:52px;height:32px;border-radius:16px;flex:none;margin-left:auto;position:relative}
.sw i{position:absolute;top:50%;border-radius:50%;background:#fff}

/* O'ng panel */
#tag{position:absolute;left:470px;top:34px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;letter-spacing:2px;color:var(--accent2)}
#tag i{display:block;height:3px;width:34px;border-radius:2px;background:var(--accent2)}
#dia{position:absolute;left:470px;top:84px;width:760px;height:510px}
.abs{position:absolute}
.node{position:absolute;border-radius:22px;background:var(--card);border:1px solid var(--border2);box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:10px}
.node svg{width:38px;height:38px;fill:var(--accent2)}
.node b{font-size:16px;font-weight:700}
.node span{font-size:12px;color:var(--dim)}
.pk{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(194,65,12,.5)}
.pk.g{background:#14532d;box-shadow:0 6px 18px rgba(74,222,128,.25);color:#bbf7d0}
.pk.b{background:#1e3a8a;box-shadow:0 6px 18px rgba(59,130,246,.3);color:#bfdbfe}
.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;border:1px solid var(--border2);background:var(--cardalt);font-size:14px;font-weight:600;white-space:nowrap}
.chip svg{width:22px;height:22px;fill:var(--accent2)}
.cc{position:absolute;left:60px;width:640px;height:98px;border-radius:22px;background:var(--card);border:1px solid var(--border2);display:flex;align-items:center;padding:0 22px;gap:18px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.cc .ic{width:54px;height:54px;border-radius:16px;background:var(--tint);border:1px solid rgba(194,65,12,.4);display:flex;align-items:center;justify-content:center;flex:none}
.cc .ic svg{width:30px;height:30px;fill:var(--accent2)}
.cc b{display:block;font-size:18px;font-weight:700}
.cc i{display:block;font-style:normal;font-size:13.5px;color:var(--dim);margin-top:4px;line-height:19px}
.mono{font-family:'DejaVu Sans Mono',monospace;color:#fb923c;letter-spacing:1px}

/* Sarlavha */
#caption{position:absolute;left:470px;top:610px;width:770px;height:84px;display:flex;align-items:center}
#caption .w{display:inline-block;font-size:24px;font-weight:600;line-height:32px;margin-right:7px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#intro{position:absolute;inset:0}
</style>
</head>
