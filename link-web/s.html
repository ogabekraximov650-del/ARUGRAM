<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARUMEDIATV: qism havolasi</title>
<meta property="og:title" content="ARUMEDIATV">
<meta property="og:description" content="Qismni ARUMEDIATV ilovasida oching">
<style>
  :root{--bg:#0b0b10;--card:#16161f;--text:#fff;--dim:#a0a0b0;--accent:#ff8a3d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
  main{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:28px 22px;text-align:center;border:1px solid #ffffff14}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--dim);font-size:14px;line-height:1.5;margin:6px 0 18px}
  .btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:16px;border:0;margin-top:10px}
  .btn.alt{background:#ffffff14;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>ARUMEDIATV</h1>
  <p id="info">Qismni ilovada ochish uchun tugmani bosing.</p>
  <a id="open" class="btn" href="#">Ilovada ochish</a>
  <a class="btn alt" href="https://arumediatv.pages.dev">Saytda ochish</a>
</main>
<script>
(function () {
  // UZ: havola yo'li /s/<anime>/<bo'lim>/<qism>. EN: path is /s/<anime>/<season>/<episode>. RU: путь /s/<аниме>/<сезон>/<серия>.
  var p = location.pathname.replace(/^\/+|\/+$/g, "").split("/");
  var ok = p[0] === "s" && p.length >= 3 && p.length <= 4 && p.slice(1).every(function (x) { return /^\d+$/.test(x); });
  var open = document.getElementById("open");
  if (!ok) { document.getElementById("info").textContent = "Havola noto'g'ri."; open.style.display = "none"; return; }
  var path = "/" + p.join("/");
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  // Android: o'rnatilgan ilova bo'lsa App Links o'zi ochadi (bu sahifa umuman ko'rinmaydi). Brauzerlarning ichki oynasi
  // (Telegram, Instagram) havolani ilovaga bermasa — shu tugma intent:// orqali ochadi.
  var intentUrl = "intent://" + location.host + path + "#Intent;scheme=https;package=uz.arumediatv.com;end";
  open.href = android ? intentUrl : "https://arumediatv.pages.dev";
  if (!android) open.textContent = "Saytda ochish";
})();
</script>
</body>
</html>
