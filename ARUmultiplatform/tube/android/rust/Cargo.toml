[package]
name = "tube_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
ureq = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Rust'da panic butun ilovani o'ldiradi — unwrap() dan saqlaning.
panic = "abort"
strip = true
