[package]
name = "aru"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Faqat uzcoders: boshqa kutubxona yo'q (hajm kichik bo'lsin).
[dependencies]
uzcoders = { path = "../uzcoders/crates/uzcoders" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
