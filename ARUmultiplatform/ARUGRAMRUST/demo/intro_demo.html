<script>

const lerp = (a, b, p) => a + (b - a) * p;

function wait(ms) { return new Promise((res) => clock.timers.push({ at: clock.t + ms, res })); }
function bez(x1, y1, x2, y2) {
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      const d = 3 * x1 * (1 - t) * (1 - t) - 6 * x1 * t * (1 - t) + 6 * x2 * t * (1 - t) - 3 * x2 * t * t + 3 * t * t;
      if (Math.abs(cx) < 1e-5 || Math.abs(d) < 1e-6) break;
      t -= cx / d;
    }
    t = clamp(t);
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };

const E = { lin: (p) => p, out: bez(0.22, 1, 0.36, 1), inOut: bez(0.65, 0, 0.35, 1), swipe: bez(0.3, 0.9, 0.2, 1) };
function spring(zeta, omega, D) {

}
function tween(dur, ease, update) {
  return new Promise((res) => { const tw = { start: clock.t, dur, ease, update, res }; update(ease(0)); clock.tweens.push(tw); });
}
const par = (...ps) => Promise.all(ps);
let curEase = E.out, curDur = 300, curStart = 0;
function advance(dt) {
  clock.t += dt;
  for (const tw of clock.tweens.slice()) {
    const p = clamp((clock.t - tw.start) / tw.dur);
    tw.update(tw.ease(p));
    if (p >= 1) { tw.update(tw.ease(1)); clock.tweens.splice(clock.tweens.indexOf(tw), 1); tw.res(); }
  }
  const due = clock.timers.filter((x) => x.at <= clock.t);
  clock.timers = clock.timers.filter((x) => x.at > clock.t);
  due.forEach((x) => x.res());
  clock.frames.forEach((f) => f(clock.t));
}

}
// 3-sahifa: bepul
const A3 = {}; { const s = art[2];
  el('circle', { r: 72, fill: 'url(#gb)' }, s);
  A3.cloud = el('path', { d: 'M-36 22 a23 23 0 0 1 3 -45 a30 30 0 0 1 56 -5 a25 25 0 0 1 12 50 Z', fill: '#fff', transform: 'translate(0,-2)' }, s);
  let d = ''; for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2, k = 1 + Math.sin(a) ** 2; d += (i ? 'L' : 'M') + (30 * Math.cos(a) / k).toFixed(2) + ' ' + (30 * Math.sin(a) * Math.cos(a) / k + 0).toFixed(2); }
  A3.inf0 = el('path', { d, fill: 'none', stroke: '#d4e9fb', 'stroke-width': 6, 'stroke-linecap': 'round', transform: 'translate(0,-1)' }, s);

}

const A4 = {}; { const s = art[3];

// nuqtalar
const dotsEl = $('dots'); const dots = PAGES.map(() => { const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); return d; });

const cv = $('curve'), cx = cv.getContext('2d');

}
clock.frames.push((t) => {

// ───────────── Sahifalar holati ─────────────
const W = 330;
const t0 = PAGES.map(() => 0);     // sahifa ko'rina boshlagan vaqt
let pos = 0;                       // 0..5 (kasr: swipe paytida)
const intro = { appear: 0 };       // birinchi ochilish (0..1)
function layout() {
  const a = Math.floor(pos), f = pos - a;
  pg.forEach((d, i) => {
    const off = i - pos;                 // -1..1
    const vis = Math.abs(off) < 1;
    d.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const artEl = d.querySelector('.art'), txt = d.querySelector('.txt');
    // parallaks: rasm sahifadan sal tezroq, matn sekinroq suriladi
    artEl.style.transform = `translateX(${off * W * 1.12}px) scale(${1 - 0.18 * Math.abs(off)})`;
    artEl.style.opacity = String(1 - Math.abs(off) * 1.1);
    txt.style.transform = `translateX(${off * W * 0.72}px)`;
    txt.style.opacity = String(1 - Math.abs(off) * 1.25);
  });
  dots.forEach((d, i) => {
    const near = clamp(1 - Math.abs(i - pos));
    d.style.width = (7 + 12 * near) + 'px';
  });
  dots.forEach((d, i) => { const near = clamp(1 - Math.abs(i - pos)); const light = theme.p; d.style.background = near > .5 ? '#2a9de8' : `rgb(${lerp(74, 196, light) | 0},${lerp(79, 202, light) | 0},${lerp(87, 210, light) | 0})`; });
}
const theme = { p: 0 };
function applyTheme() {
  const p = theme.p; const mix = (a, b) => `rgb(${lerp(a[0], b[0], p) | 0},${lerp(a[1], b[1], p) | 0},${lerp(a[2], b[2], p) | 0})`;
  $('screen').style.background = mix([17, 20, 24], [244, 247, 251]);
  $('screen').style.color = mix([255, 255, 255], [16, 24, 34]);
  document.querySelectorAll('.pg p').forEach((e) => { e.style.color = mix([208, 214, 222], [76, 90, 108]); });
  $('lang').style.color = mix([74, 163, 224], [30, 120, 200]);
  $('status').style.color = mix([255, 255, 255], [16, 24, 34]);
  $('wm').querySelector('text').setAttribute('fill', mix([255, 255, 255], [16, 24, 34]));

// quyosh -> oy
function sunMoon(p) {
  rays.forEach((r, i) => { const k = clamp((1 - p) * 1.4 - i * 0.02); r.setAttribute('opacity', String(k)); r.setAttribute('transform', `scale(${lerp(.5, 1, clamp((1 - p)))})`); });
  $('core').setAttribute('r', String(lerp(6, 9.5, p)));
  $('mmc').setAttribute('cx', String(lerp(30, 5.5, clamp(p * 1.2 - 0.1))));
  $('mmc').setAttribute('cy', String(lerp(-30, -4.5, clamp(p * 1.2 - 0.1))));

}
// ───────────── Rasm animatsiyalari (har kadr) ─────────────
const PS = [0, 1, 2, 3, 4, 5].map(() => 0); // aniq sahifa-lokal vaqt
function art1(lt) {
  const ap = clamp(lt / 900);
  A1.m1.setAttribute('stroke-dashoffset', String(300 * (1 - E.out(ap))));
  A1.m2.setAttribute('stroke-dashoffset', String(90 * (1 - E.out(clamp((lt - 300) / 700)))));
  const bre = 1 + 0.025 * Math.sin(lt / 1000 * 2.4);
  A1.mark.setAttribute('transform', `translate(-40,-42) scale(${0.84 * bre})`);
  A1.orbit.setAttribute('transform', `rotate(${lt / 1000 * 38})`);

}
function art2(lt) {
  const T = 2800, u = (lt % T);
  // 0..650 kirish, 650..2100 to'xtaydi, 2100..2700 chiqib ketadi
  let x, fast = 0;
  if (u < 650) { const p = u / 650; x = lerp(-130, 0, E.out(p)); fast = 1 - p; }
  else if (u < 2100) { x = 0; }
  else { const p = clamp((u - 2100) / 600); x = lerp(0, 140, bez(.5, 0, 1, 1)(p)); fast = p; }
  A2.b.setAttribute('transform', `translate(${x},0)`);
  A2.lines.forEach((l, i) => { l.setAttribute('x', String(x - 82 - i * 6 - fast * 22)); l.setAttribute('width', String(8 + fast * 52)); l.setAttribute('opacity', String(.15 + .6 * fast)); });
  const c = clamp((u - 900) / 600); A2.chk.setAttribute('stroke-dashoffset', String(70 * (1 - E.out(c))));
  A2.st.forEach((s) => star(s.g, s.x, s.y, s.sc, lt, s.ph));
}
function art3(lt) {
  A3.inf.setAttribute('stroke-dashoffset', String(-((lt / 2600) % 1) * 100));
  A3.cloud.setAttribute('transform', `translate(0,${-2 + Math.sin(lt / 1000 * 2.2) * 2.4})`);
  A3.st.forEach((s) => star(s.g, s.x, s.y, s.sc, lt, s.ph));
}
function art4(lt) {
  const pulse = 1 + 0.07 * Math.sin(lt / 1000 * 5);
  A4.bolt.setAttribute('transform', `scale(${pulse})`);
  pulseRing(A4.ring, lt, 1600, 72, 98, 0, 4);
  const items = A4.chips.map((g, k) => { const a = lt / 5000 * Math.PI * 2 + k * Math.PI * 2 / 3; const x = Math.cos(a) * 80, y = Math.sin(a) * 30 - Math.cos(a) * 12; const depth = Math.sin(a); return { g, x, y, depth }; }).sort((p, q) => p.depth - q.depth);
  items.forEach((it) => {
    const sc = 0.68 + 0.3 * (0.5 + 0.5 * it.depth);
    it.g.setAttribute('transform', `translate(${it.x.toFixed(2)},${it.y.toFixed(2)}) scale(${sc.toFixed(3)}) rotate(${(Math.cos(it.x / 40) * 8).toFixed(1)})`);
    it.g.setAttribute('opacity', String(0.6 + 0.4 * (0.5 + 0.5 * it.depth)));
    (it.depth < 0 ? A4.back : A4.front).appendChild(it.g);

}
function art5(lt) {
  pulseRing(A5.ring, lt, 3200, 72, 98, 0, 3);
  const dr = clamp(lt / 800); const s = lerp(.2, 1, spring(0.5, 24, .8)(dr)); A5.shield.setAttribute('transform', `scale(${s})`); A5.shield.setAttribute('opacity', String(clamp(dr * 3)));

  // paket: telefon -> bulut (0..0.4), bulut -> noutbuk (0.5..0.9)
  const pt = (x0, y0, cx_, cy_, x1, y1, p) => { const a = (1 - p) * (1 - p), b = 2 * (1 - p) * p, c = p * p; return [a * x0 + b * cx_ + c * x1, a * y0 + b * cy_ + c * y1]; };
  const p1 = clamp(u / 0.4), p2 = clamp((u - 0.5) / 0.4);

  A6.pk[1].setAttribute('cx', x2.toFixed(2)); A6.pk[1].setAttribute('cy', y2.toFixed(2)); A6.pk[1].setAttribute('opacity', String(u >= 0.5 && u < 0.92 ? 1 : 0));

}
const ARTS = [art1, art2, art3, art4, art5, art6];
clock.frames.push((t) => {
  pg.forEach((d, i) => { if (d.style.display !== 'none') ARTS[i](t - t0[i]); });
  const s = Math.floor((t / 60000)); $('clk').textContent = '9:41';
});

// ───────────── Barmoq izi ─────────────
async function tapAt(x, y) {
  const tc = $('touch'); tc.style.left = x + 'px'; tc.style.top = y + 'px';
  await tween(230, E.out, (p) => { tc.style.opacity = String(p < .55 ? p / .55 : 1 - (p - .55) / .45 * 0.9); tc.style.transform = `scale(${lerp(.35, 1.05, p)})`; });
  tc.style.opacity = '0';
}
async function swipeTo(next) { // chapga surish
  const tc = $('touch'); const target = next;
  t0[next] = clock.t;
  const from = pos, y = 250;
  tc.style.left = '250px'; tc.style.top = y + 'px';
  await tween(580, E.swipe, (p) => {
    pos = lerp(from, target, p);
    layout();
    const fp = clamp(p / 0.78);
    tc.style.left = lerp(250, 70, E.out(fp)) + 'px';
    tc.style.opacity = String(p < 0.06 ? p / 0.06 : (p > 0.78 ? 1 - clamp((p - 0.78) / 0.22) : 1));
    tc.style.transform = `scale(${p < 0.1 ? 0.85 : 1})`;
  });
  tc.style.opacity = '0'; pos = target; layout();
}

// ───────────── Ssenariy ─────────────
async function main() {
  // boshlang'ich holat
  theme.p = 0; applyTheme(); sunMoon(0); layout();
  $('screen').style.opacity = '1';
  const stuff = [$('sun'), $('dots'), $('lang'), $('cta')];
  stuff.forEach((e) => { e.style.opacity = '0'; });
  pg[0].querySelector('.art').style.opacity = '0'; pg[0].querySelector('.txt').style.opacity = '0';
  await wait(350);
  setScene(0);
  t0[0] = clock.t;
  // 1-sahifa chiqishi

  const sp = spring(0.5, 22, 0.7);
  await par(
    tween(700, sp, (p) => { art0.style.opacity = String(clamp(p * 3)); art0.style.transform = `scale(${lerp(.4, 1, p)})`; }),

    )),
  );

    setScene(i);
    await swipeTo(i);
    await wait(i === 5 ? 3100 : 2700);
  }
  // tema tugmasi

  await wait(300);
  await tapAt(296 - 0, 56 + 0);
  await tween(520, E.inOut, (p) => { theme.p = p; applyTheme(); sunMoon(p); layout(); });

    cta.style.transform = 'scale(1)';
    const w = lerp(298, 58, p), h = lerp(46, 58, p), x = lerp(16, 330 - 22 - 58, p), y = lerp(578, 570, p);

    cta.querySelector('span').style.opacity = String(clamp(1 - p * 2.4));
    $('ctaArr').style.opacity = String(clamp((p - 0.45) * 2));
    $('pages').style.opacity = String(1 - p); $('pages').style.transform = `translateY(${-18 * p}px) scale(${1 - .04 * p})`;
    $('dots').style.opacity = String(1 - p); $('lang').style.opacity = String(1 - p); $('sun').style.opacity = String(1 - p);
    $('login').style.opacity = String(clamp((p - 0.35) / 0.65)); $('login').style.transform = `translateY(${(1 - p) * 24}px)`;
  });
  await wait(2200);

}
window.start = () => { main().then(() => { window.__finished = true; }); };
if (!new URLSearchParams(location.search).has('manual')) window.start();
