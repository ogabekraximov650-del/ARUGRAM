[package]
name = "arugramrust"
version = "0.1.0"
edition = "2021"
publish = false
description = "ARUGRAM (Rust, uzcoders): tanishtiruv va telefon raqami kirishi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# uzcoders kutubxonasining nusxasi shu repoda: ARUmultiplatform/uzcoders.
uzcoders = { path = "../uzcoders/crates/uzcoders" }
# Faqat `raster` moduli (vektor chizish): tanishtiruv animatsiyalari shu bilan chiziladi.
uzcoders-lottie = { path = "../uzcoders/crates/uzcoders-lottie" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
