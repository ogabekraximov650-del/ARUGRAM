[package]
name = "aru_core"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib — Android uchun `libaru_core.so` (Kotlin JNI shu bilan ishlaydi)
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Rust'da panic JNI chegarasidan o'tolmaydi — darhol to'xtaydi (unwrap'dan saqlanamiz).
panic = "abort"
