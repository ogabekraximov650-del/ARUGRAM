[package]
name = "tgstore-jr"
version = "0.1.0"
edition = "2024"
description = "UZ: Ample jurnal-baza serveri (libSQL + db_N_vV jurnal papkalari + Telegram nusxa). EN: Ample journal-store server (libSQL + db_N_vV journal folders + Telegram copy). RU: сервер журнальной базы Ample."

[dependencies]
libsql = { version = "0.10", default-features = false, features = ["core"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "json"] }
aes-gcm = "0.11"
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
base64 = "0.22"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
