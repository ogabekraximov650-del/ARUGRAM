[package]
name = "ytbot"
version = "0.1.0"
edition = "2024"
description = "UZ: yt-dlp Telegram boti (navbat libsql, video ~45 MB li qismlarga bo'linib bot orqali yuboriladi). EN: yt-dlp Telegram bot (libsql queue, video split into ~45 MB parts sent through the Bot API)."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
serde_json = "1"
libsql = "0.10"
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
