[package]
name = "arumediatv"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# uzcoders kutubxonasining nusxasi shu repoda: ARUmultiplatform/uzcoders (VENDOR.md).
uzcoders = { path = "../uzcoders/crates/uzcoders" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
