[package]
name = "arumediatv"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# uzcoders kutubxonasining nusxasi shu repoda: ARUmultiplatform/uzcoders (VENDOR.md).
uzcoders = { path = "../uzcoders/crates/uzcoders" }
uzcoders-lottie = { path = "../uzcoders/crates/uzcoders-lottie" }

# Rust yadro (imzo, shifrlash, pleyer keshi). Telegram (grammers/MTProto) O'CHIRILGAN: Telegram faqat worker orqali.
rust_core = { path = "../android/rust", default-features = false }
serde_json = "1"
# Worker `vd` tizimi: rasm/video bo'laklari AES-128-CTR bilan shifrlangan (kalitni worker beradi), ilova o'zi ochadi.
aes = "0.9"
ctr = "0.10"
ureq = "2"
# WebP (stiker/GIF to'plam kichik rasmlari, posterlar): sof Rust dekoder.
image-webp = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# unwind: Telegram chaqiruvlaridagi kutilmagan panic ilovani yopmasligi uchun (yadro `catch_unwind` ishlatadi).
panic = "unwind"
strip = true
