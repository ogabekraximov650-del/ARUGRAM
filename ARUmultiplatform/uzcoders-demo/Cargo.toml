[package]
name = "uzdemo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# uzcoders reposi CI'da repo ildizidagi `uzcoders/` papkasiga yuklanadi (workflow'ga qarang).
uzcoders = { path = "../../uzcoders/crates/uzcoders" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
