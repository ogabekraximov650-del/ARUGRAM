name = "arudrive"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

# Issiq bo'laklar va yuklash uchun R2 (ARUMEDIATV bilan umumiy `arumediatv` bucket, kalitlar `bd/` bilan boshlanadi).
[[r2_buckets]]
binding = "R2"
bucket_name = "arumediatv"

# Har 10 daqiqada: R2 -> Telegram saqlash navbatini davom ettiradi (yuklash tugagan zahoti saqlash baribir darhol boshlanadi).
[triggers]
crons = ["*/10 * * * *"]

# O'ziga xizmat ulanishi: katta fayl saqlashda worker o'zini zanjir bilan qayta chaqiradi (workers.dev manziliga o'zi so'rov yubora olmaydi).
[[services]]
binding = "SELF"
service = "arudrive"

# Durable Object `ListHub` o'chirilgan (migratsiya v2 serverda qo'llangan); yangi wrangler yo'q sinf uchun migratsiyani rad etadi, shu sabab blok olib tashlandi.

# Workers Caching: ro'yxat Cloudflare keshida turadi, yozuvda `cache.purge()` (tag `list`) bilan GLOBAL o'chiriladi. Cache-Control'siz javob 2 soat keshlanadi,
# shu sabab ichki ro'yxatdan boshqa hamma javobga kodda `no-store` qo'yiladi (lib.rs `no_store`).
[cache]
enabled = true
