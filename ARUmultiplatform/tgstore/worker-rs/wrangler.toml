# UZ: tgstore TEST worker (Rust). Production `arumediatv` ning nusxasi, lekin ALOHIDA nom, cron YO'Q (production vazifalariga aralashmaydi).
# EN: tgstore TEST worker (Rust). A copy of production `arumediatv` under a SEPARATE name with NO cron triggers.
# RU: TEST-worker tgstore (Rust). Kopiya produkshna pod otdelnym imenem, BEZ cron.
name = "tgstore-rs"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
workers_dev = true

[build]
command = "cargo install -q worker-build --version 0.8.7 && worker-build --release"

[vars]
# UZ: baza = Ample PostgreSQL (pg-gateway orqali, Turso formatida). EN: DB = Ample PostgreSQL via the pg-gateway (Turso-shaped). RU: baza = Ample PostgreSQL.
DB_BACKEND = "pg"
# UZ: R2 yo'llari alohida prefiksda (production bilan aralashmaydi). EN: R2 keys under their own prefix. RU: klyuchi R2 pod svoim prefiksom.
R2_PREFIX = "tgstore/"

# UZ: Smart Placement: Worker Ample (San-Xose) yaqiniga joylashadi — bir so'rovdagi ketma-ket baza chaqiruvlari tezlashadi. EN/RU: runs the Worker near its backend.
[placement]
mode = "smart"

[ai]
binding = "AI"

[durable_objects]
bindings = [
  { name = "ENCODE_LIVE", class_name = "EncodeLive" },
  { name = "MARK_HUB", class_name = "MarkHub" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EncodeLive", "MarkHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KvRegistry"]

# UZ: ro'yxat Supabase'ga ko'chdi — DO sinfi o'chiriladi (DO qimmat). EN: registry moved to Supabase — the DO class is deleted. RU: reestr v Supabase.
[[migrations]]
tag = "v3"
deleted_classes = ["KvRegistry"]

# UZ: BITTA cron (bepul reja 5 ta cron bilan cheklangan): har 10 daqiqada (:05, :15, ...) eski fayllarni tozalash (GC); 00:05 UTC (= Toshkent 05:05) da qo'shimcha Supabase "uyg'otish". EN: daily at 05:00 Tashkent (00:00 UTC): keep-alive + GC.
[triggers]
crons = ["* * * * *"]
