name = "arugram"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

# ══════════════════════════════════════════════════════════════
#  ESKI DURABLE OBJECT'NI TOZA OLIB TASHLASH
# ══════════════════════════════════════════════════════════════
#
# Bir muddat `PresenceHub` nomli Durable Object bor edi (onlayn
# holat va qo'ng'iroq uchun). U KODDAN OLIB TASHLANDI, lekin
# Cloudflare hisobida sinf ro'yxatda qolgan.
#
# BU BLOKNI O'CHIRMANG. Usiz keyingi `wrangler deploy` xato
# bilan to'xtaydi: kod sinfni endi eksport qilmaydi, Cloudflare
# esa uni hali ham kutadi.
#
# `deleted_classes` aynan shu holat uchun: Cloudflare sinfni va
# uning omborini o'zi tozalaydi. Migratsiya BIR MARTA
# qo'llaniladi, keyin bu blok shunchaki tarix bo'lib qoladi.
#
# Tartib MUHIM: `v1` allaqachon qo'llangan, shu sabab u ham
# ro'yxatda turishi kerak — wrangler zanjirni boshidan
# tekshiradi.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceHub"]

[[migrations]]
tag = "v2"
deleted_classes = ["PresenceHub"]

# ══════════════════════════════════════════════════════════════
#  KODLASH HOLATI — `EncodeLive` (Durable Object)
# ══════════════════════════════════════════════════════════════
#
# Runner har daqiqada to'liq log va statistikani yuboradi, admin paneli
# o'qiydi (`worker/src/lib.rs` -> `EncodeLive`). Butun dunyo uchun bitta
# nusxa (oddiy Cloudflare keshi har data markazda alohida bo'lgani uchun
# u yaramaydi). Turso ishlatilmaydi. SQLite asosidagi sinf — bepul
# rejada ham ishlaydi (avvalgi `PresenceHub` kabi).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["EncodeLive"]

# ══════════════════════════════════════════════════════════════
#  O'ZGARISH BELGILARI — `MarkHub` (Durable Object)
# ══════════════════════════════════════════════════════════════
#
# Turso'ga yozuv bo'lganda jadval belgisi shu yerda yangilanadi; o'qishda
# "o'zgarish bormi" shu yerdan so'raladi — butun dunyo uchun BITTA nusxa
# (`worker/src/lib.rs` -> `MarkHub`).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["MarkHub"]

[durable_objects]
bindings = [
  { name = "ENCODE_LIVE", class_name = "EncodeLive" },
  { name = "MARK_HUB", class_name = "MarkHub" },
]

[env.production]
name = "arugram"
workers_dev = true

# Durable Object bog'lanishi muhitga MEROS bo'lmaydi — shu yerda qayta.
[env.production.durable_objects]
bindings = [
  { name = "ENCODE_LIVE", class_name = "EncodeLive" },
  { name = "MARK_HUB", class_name = "MarkHub" },
]

# Secrets (GitHub Actions orqali o'rnatiladi):
# wrangler secret put TURSO_URL --env production
# wrangler secret put TURSO_TOKEN --env production
# wrangler secret put B2_KEY_ID --env production
# wrangler secret put B2_APPLICATION_KEY --env production
# wrangler secret put TELEGRAM_BOT_TOKEN --env production
# wrangler secret put TEZCHECK_TOKEN --env production
# wrangler secret put TEZCHECK_DESK --env production
# wrangler secret put TEZCHECK_WEBHOOK_SECRET --env production
# wrangler secret put ENCODE_BOT_TOKEN --env production   (kodlash boti)
# wrangler secret put GH_ACTIONS_TOKEN --env production   (encode.yml ni ishga tushirish)
#
# TEZCHECK_TOKEN  — hisob tokeni (`aps_...`). MAXFIY: tezcheck.uz
#                   faqat uning SHA-256 xeshini saqlaydi, ya'ni
#                   yo'qotilsa qaytarib bo'lmaydi, yangisi
#                   yaratiladi.
# TEZCHECK_DESK   — kassa kodi (`cdk_...`).
# TEZCHECK_WEBHOOK_SECRET — webhook imzosi kaliti (`wbs_...`).
#                   Qo'yilmasa webhook manzili UMUMAN ishlamaydi
#                   (503) va pul faqat "Tekshirish" tugmasi bilan
#                   hisobga olinadi.
#
# Uchalasi ham FAQAT worker ichida ishlatiladi va ilovaga hech
# qachon chiqmaydi.

# Cron — har 10 daqiqada avto-kodlash navbati tekshiriladi
# (`worker/src/lib.rs` -> `scheduled`, `encode_kick`): navbatda ish
# bo'lsa-yu, Actions ishlamayotgan bo'lsa `encode.yml` ishga
# tushiriladi. Navbat bo'sh bo'lsa bazaga bitta o'qish, GitHub'ga
# so'rov yo'q. Bot nusxalarini esa hanuz ilova o'zi tozalaydi.
[env.production.triggers]
crons = ["*/10 * * * *"]
