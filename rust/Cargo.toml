[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib — Android uchun .so, Dart FFI shu bilan ishlaydi
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# ── Shifrlash ───────────────────────────────────────────────────────
# ring       — BARCHA shifrlash (AES-GCM): video bo'laklari (AES-128) va
#              kichik fayllar — ro'yxatlar, rasmlar (AES-256). Ilovada
#              HTTPS (ureq/rustls) uchun allaqachon bor; 64-bit da
#              apparat AES, 32-bit da NEON bilan ishlaydi
#              (`crypto.rs` dagi "NEGA CBC EMAS" izohi).
# hkdf+sha2  — bitta asosiy kalitdan har bir fayl uchun ALOHIDA kalit
#              hosil qilish (kalitni qayta ishlatmaslik uchun).
# getrandom  — kriptografik tasodifiy sonlar (asosiy kalit, nonce).
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
# hmac — serverga yuboriladigan so'rov imzosi (`app_sign`).
hmac = "0.12"
getrandom = "0.2"
hex = "0.4"

# ── Telegram (videoni Telegram serveridan olish, `telegram.rs`) ───
# grammers — Rust'dagi Telegram (MTProto) klienti. TDLib emas: TDLib
#            yuklangan faylni diskka OCHIQ yozadi, grammers esa
#            baytlarni faqat xotiraga qaytaradi.
# Versiyalar QAT'IY: 0.x kutubxonada kichik versiya ham API'ni
# o'zgartirishi mumkin.
grammers-client = { version = "=0.10.0", default-features = false }
grammers-mtsender = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
# grammers-crypto `glass_pumpkin = "2.0.0-rc0"` so'raydi va Cargo
# 2.0.0-rc1 ni tanlaydi — u API'ni buzgan, kompilyatsiya yiqiladi.
# Cargo.lock repoda saqlanmaydi, shu sabab versiya shu yerda qotiriladi.
glass_pumpkin = "=2.0.0-rc0"
# 2 bosqichli parol (SRP) — `grammers` ning `check_password` kirish
# tokenini (`future_auth_token`) tashlab yuboradi, shu sabab parol
# `telegram.rs` da shu kutubxona bilan tekshiriladi.
grammers-crypto = "=0.10.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
# aes + ctr — Telegram'ga yuklanadigan fayllar AES-128-CTR bilan
#              shifrlanadi (`telegram.rs` -> "SHIFRLAB YUKLASH"). CTR
#              faylning ISTALGAN joyini alohida ochishga imkon beradi:
#              pleyer faqat kerakli baytlarni oladi va ochadi.
#              Versiyalar grammers-crypto bilan bir xil (qayta
#              kompilyatsiya yo'q).
aes = "0.9"
ctr = "0.10"
# jni — ExoPlayer manbasi (`player_source.rs`) Java bilan shu orqali gaplashadi.
jni = { version = "0.21", default-features = false }
# tlottie — Telegram Android / Cherrygram ishlatadigan Lottie chizgich
# (sof Rust, MIT). `third_party/tlottie/SOURCE.md` ga qarang.
tlottie = { path = "third_party/tlottie", default-features = false, features = ["cpu", "std"] }
# flate2 — `.tgs` stiker gzip'langan Lottie JSON (sof Rust, miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
# rlottie (C++) va libvpx (C) ni yig'ish uchun (`build.rs`).
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Testlar optimallashgan holda yig'iladi: yuklab olish testlaridagi
# sinov serverlari baytlarni birma-bir hosil qiladi va debug
# rejimida "tez manba" amalda sekin bo'lib qolardi — natijada ish
# o'g'irlash (haqli ravishda) ishga tushib, so'rovlar sonini
# o'lchaydigan testlar noto'g'ri sharoitda tekshirilardi.
[profile.test]
opt-level = 2
