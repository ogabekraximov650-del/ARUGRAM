name: Saqlash kanalini almashtirish — BIR MARTA

# `ci/CHAN_MOVE_ONCE` ("<eski_kanal> <yangi_kanal>") o'zgarganda ishlaydi. Worker `POST /api/vd/move_channel` (ENCODE_TOKEN) hamma saqlangan faylni
# (rasm, bo'lak, qism, `tg_files`) yangi kanalga ko'chiradi va fayl ID'lari / xabar raqamlarini bazada yangilaydi. Eski kanaldagi xabarlar O'CHIRILMAYDI.
# Har chaqiruvda <= 8 qator (Cloudflare 50 so'rov chegarasi); `remaining` 0 bo'lguncha takrorlanadi.

on:
  push:
    branches: [main]
    paths: ['ci/CHAN_MOVE_ONCE']

permissions:
  contents: read

concurrency:
  group: chan-move
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
      - name: Ko'chirish
        run: |
          set -u
          FROM=$(awk '{print $1}' ci/CHAN_MOVE_ONCE); TO=$(awk '{print $2}' ci/CHAN_MOVE_ONCE)
          echo "Kanal: $FROM -> $TO"
          TOKEN=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          for i in $(seq 1 60); do
            R=$(curl -sS -m 120 -X POST "$API_BASE/api/vd/move_channel" -H "X-Encode-Token: $TOKEN" -H 'Content-Type: application/json' -H 'User-Agent: arumediatv-chan-move' -d "{\"from\":$FROM,\"to\":$TO,\"limit\":8}" || echo '{}')
            echo "$i: $R" | head -c 700; echo
            OK=$(printf '%s' "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(1 if d.get("ok") else 0)' 2>/dev/null || echo 0)
            if [ "$OK" != "1" ]; then echo "::error::Ko'chirish to'xtadi (bot yangi kanalda admin bo'lishi kerak)"; exit 1; fi
            REM=$(printf '%s' "$R" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("remaining",0))')
            MOV=$(printf '%s' "$R" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("moved",0))')
            if [ "$REM" = "0" ]; then echo "Tayyor: hammasi ko'chdi."; exit 0; fi
            if [ "$MOV" = "0" ]; then echo "::error::Qolgan $REM ta qator ko'chmadi (xatolar yuqorida)"; exit 1; fi
          done
          echo "::error::Takrorlashlar tugadi"; exit 1
