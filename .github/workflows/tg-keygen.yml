name: Telegram hisob maxfiy ma'lumotlari uchun kalit juftligi

# `ci/tg-keygen.run` o'zgarganda: RSA kalit juftligi yaratiladi. OCHIQ kalit (`pub.pem`) bilan ikki bosqichli parol lokal shifrlanadi;
# MAXFIY kalit esa ENCODE_TOKEN bilan shifrlangan holda (`tg-key.enc`) saqlanadi (xuddi `tool/encode/session.enc` kabi).
# Ochiq matnli maxfiy kalit hech qachon artifakt/log/repoga chiqmaydi.
on:
  push:
    branches: [main]
    paths:
      - 'ci/tg-keygen.run'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Kalit juftligi
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          mkdir -p out
          openssl genrsa -out "$RUNNER_TEMP/priv.pem" 3072 2>/dev/null
          openssl rsa -in "$RUNNER_TEMP/priv.pem" -pubout -out out/pub.pem 2>/dev/null
          K="$K" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$RUNNER_TEMP/priv.pem" -out out/tg-key.enc
          shred -u "$RUNNER_TEMP/priv.pem" || rm -f "$RUNNER_TEMP/priv.pem"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tg-keypair
          path: out
          retention-days: 2
