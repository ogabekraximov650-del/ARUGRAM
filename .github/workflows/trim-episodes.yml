name: Trim episodes (delete episodes above N of one season)

# UZ: `ci/TRIM_EPISODES` fayli o'zgarganda ishlaydi. Ichida: `dry` (faqat ko'rsatadi) yoki `delete <anime_id> <season_id> <N>`.
#     Jonli baza (worker ishlatadigan) tanlanadi, fayllar worker orqali o'chadi (`ci/trim_episodes.py`).
# EN: Runs when `ci/TRIM_EPISODES` changes: `dry` or `delete <anime_id> <season_id> <N>`.
# RU: Запускается при изменении `ci/TRIM_EPISODES`: `dry` или `delete <anime_id> <season_id> <N>`.

on:
  push:
    branches: [main]
    paths: ['ci/TRIM_EPISODES', 'ci/trim_episodes.py', '.github/workflows/trim-episodes.yml']

permissions:
  contents: read

concurrency:
  group: trim-episodes
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Jonli baza ulanishi
        env:
          OLD_URL: ${{ secrets.TURSO_URL }}
          OLD_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          U="$OLD_URL"; T="$OLD_TOKEN"; SRC="secret"
          if [ -f tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then U="$NU"; T="$NK"; SRC="new_turso.enc"; fi
          fi
          echo "::add-mask::$U"; echo "::add-mask::$T"
          echo "TURSO_URL=$U" >> "$GITHUB_ENV"; echo "TURSO_TOKEN=$T" >> "$GITHUB_ENV"
          echo "Baza manbasi: $SRC"
      - name: Run
        run: python3 ci/trim_episodes.py
