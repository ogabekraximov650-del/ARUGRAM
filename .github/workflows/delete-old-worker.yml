name: Eski worker'ni o'chirish (bir martalik)

# `tool/migrate/delete_old.txt` o'zgarganda: baza va nomlar ko'chirilgach eski worker Cloudflare'dan o'chiriladi
# (foydalanuvchi talabi). Bot webhook'lari yangi worker'da; eski worker o'z bazasini o'zgartirib, farq hosil qilardi.
on:
  push:
    branches: [main]
    paths:
      - 'tool/migrate/delete_old.txt'

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: secret
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: wrangler
        run: npm install -g wrangler
      - name: O'chirish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OLD=$(tr -d '[:space:]' < /dev/stdin <<< "$(printf 'aru%s' 'gram')")
          NEW=arumediatv
          [ "$OLD" != "$NEW" ] || { echo "nomlar bir xil — to'xtadi"; exit 1; }
          wrangler delete --name "$OLD" --force
          echo "✅ eski worker o'chirildi"
