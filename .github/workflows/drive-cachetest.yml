name: ARUDRIVE cachetest (sinov worker) — deploy

on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/drive/cachetest/**'
      - '.github/workflows/drive-cachetest.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/drive/cachetest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
