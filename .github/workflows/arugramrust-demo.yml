name: ARUGRAMRUST — animatsiya videosi

# `ARUmultiplatform/ARUGRAMRUST/demo/**` o'zgarganda: demo (hozir: kirish oqimi) animatsiyasini 60 fps video qilib chiqaradi
# va Telegram "Saqlangan xabarlar"ga yuboradi (foydalanuvchi talabi: video faqat Actions'da yasaladi).
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/ARUGRAMRUST/demo/**'
      - 'tool/notify/send_video.py'
      - '.github/workflows/arugramrust-demo.yml'

permissions:
  contents: read

concurrency:
  group: arugramrust-demo
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `ENCODE_TOKEN`, `TG_API_ID`, `TG_API_HASH` — Environment secret (arumediatv-rs.yml bilan bir xil).
    environment: secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg, Playwright (Chromium)
        working-directory: ARUmultiplatform/ARUGRAMRUST/demo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          npm init -y >/dev/null
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Video (hisobga kirish, Telegram uslubida)
        id: video
        working-directory: ARUmultiplatform/ARUGRAMRUST/demo
        run: |
          OUT="$RUNNER_TEMP/video"; mkdir -p "$OUT"
          DEMO=tg_video.html node render.mjs video "$OUT/raw.mp4"
          # Ovozsiz mp4 Telegram'da GIF bo'lib ko'rinadi: jim audio yo'l qo'shib, oddiy VIDEO qilamiz.
          ffmpeg -y -loglevel error -i "$OUT/raw.mp4" -f lavfi -i anullsrc=r=44100:cl=stereo -c:v copy -c:a aac -b:a 64k -shortest -movflags +faststart "$OUT/arugram_kirish_animatsiya.mp4"
          rm -f "${OUT:?}/raw.mp4" "${OUT:?}/raw.mp4.txt"
          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Videoni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          S="$RUNNER_TEMP/notify_session"
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
            -in tool/encode/session.enc -out "$S.session"
          head -c 16 "$S.session" | grep -q "SQLite format 3"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ steps.video.outputs.dir }}/arugram_kirish_animatsiya.mp4" | cut -d. -f1)
          python tool/notify/send_video.py "$S" "${{ steps.video.outputs.dir }}/arugram_kirish_animatsiya.mp4" "ARUGRAM hisobga kirish (Telegram uslubida, build ${{ github.run_number }})" "$DUR"
          rm -f "$S.session"

      - uses: actions/upload-artifact@v4
        with:
          name: arugram-login-video-${{ github.run_number }}
          path: ${{ steps.video.outputs.dir }}/*.mp4
          retention-days: 30
