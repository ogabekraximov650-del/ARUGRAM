name: ARUMEDIATV (Rust + uzcoders) — build va APK

# `ARUmultiplatform/arumediatv-rs/**` o'zgarganda: testlar -> faqat armeabi-v7a (32 bit) -> aapt2 bilan APK (Gradle'siz) -> Telegram.
# Kutubxona nusxasi `ARUmultiplatform/uzcoders` da (token kerak emas).
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/arumediatv-rs/**'
      - 'ARUmultiplatform/uzcoders/**'
      - 'ARUmultiplatform/android/rust/**'
      - '.github/workflows/arumediatv-rs.yml'

permissions:
  contents: read

concurrency:
  group: arumediatv-rs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `APP_SIGN_SECRET` (so'rov imzosi siri) Environment secret (android-native.yml bilan bir xil).
    environment: secret
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/arumediatv-rs -> target"

      - name: Testlar (kompyuterda, boshsiz)
        working-directory: ARUmultiplatform/arumediatv-rs
        run: cargo test

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Android uchun yig'ish
        working-directory: ARUmultiplatform/arumediatv-rs
        env:
          APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}
        run: |
          cargo ndk -t armeabi-v7a --platform 28 -o jniLibs build --release
          ls -la jniLibs/*/

      - name: Media3 ExoPlayer kutubxonalari (Maven, Google Maven)
        working-directory: ARUmultiplatform/arumediatv-rs
        run: |
          mvn -q -B -f media3/pom.xml dependency:copy-dependencies -DoutputDirectory="$PWD/media3/libs"
          mkdir -p media3/jars
          for f in media3/libs/*.aar; do unzip -p "$f" classes.jar > "media3/jars/$(basename "${f%.aar}").jar"; done
          cp media3/libs/*.jar media3/jars/
          ls media3/jars | wc -l

      - name: APK yig'ish va imzolash (aapt2 + apksigner)
        id: apk
        working-directory: ARUmultiplatform/arumediatv-rs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          # ARU logotipi (ilova belgisi): resurslar aapt2 bilan kompilyatsiya qilinib APK ga qo'shiladi.
          "$BT/aapt2" compile --dir res -o res.zip
          "$BT/aapt2" link -o base.apk -I "$PLAT/android.jar" -R res.zip --manifest AndroidManifest.xml \
            --min-sdk-version 28 --target-sdk-version 34 --version-code ${{ github.run_number }}
          # Java yelimi (klaviatura, ExoPlayer ko'prigi): javac + d8. Media3 jar'lari oldingi qadamda Maven bilan olingan.
          mkdir -p classes dex
          M3=$(ls media3/jars/*.jar | tr '\n' ':')
          javac --release 8 -nowarn -encoding UTF-8 -cp "$PLAT/android.jar:$M3" -d classes $(find ../uzcoders/crates/uzcoders-android/java java -name '*.java')
          # R8: ishlatilmaydigan Media3/Guava kodi olib tashlanadi (APK hajmi). Kirish nuqtalari saqlanadi.
          {
            echo '-keep class uz.uzcoders.** { *; }'
            echo '-keep class uz.arumediatv.rs.** { *; }'
            echo '-keep class io.flutter.plugins.videoplayer.** { *; }'
            echo '-keepclasseswithmembernames class * { native <methods>; }'
            echo '-dontobfuscate'
            echo '-dontwarn **'
            echo '-ignorewarnings'
            for f in media3/libs/*.aar; do unzip -p "$f" proguard.txt 2>/dev/null || true; done
          } > media3/rules.pro
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.R8 --release --min-api 28 --lib "$PLAT/android.jar" --pg-conf media3/rules.pro --output dex $(find classes -name '*.class') media3/jars/*.jar
          ls -la dex/classes.dex
          (cd dex && zip -q ../base.apk classes.dex)
          mkdir -p apk/lib && cp -r jniLibs/* apk/lib/
          (cd apk && zip -q -r -0 ../base.apk lib)
          "$BT/zipalign" -p -f 4 base.apk aligned.apk
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          "$BT/apksigner" sign --ks ../../ci/release.keystore --ks-key-alias arumedia \
            --ks-pass pass:arumedia --key-pass pass:arumedia \
            --out "$OUT/arumediatv-rs-${{ github.run_number }}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"/*.apk | head -3
          unzip -l "$OUT"/*.apk | grep -E "libarumediatv|AndroidManifest|classes.dex"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      # Runner'dagi standart Python 3.14 da Pyrogram import xatosi beradi (`There is no current event loop`) — 3.11 qo'yiladi (android-native.yml kabi).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: APK'ni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" "ARUMEDIATV Rust build ${{ github.run_number }}"
            rm -f "$S.session"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: arumediatv-rs-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30

  # Animatsiya videosi (HarmonyOS uslubidagi harakat prototipi): FAQAT `arumediatv-rs/video/` o'zgarganda ishlaydi.
  # Haqiqiy ekranlar `cargo test` snapshotlaridan olinadi, video Python (Pillow) + ffmpeg bilan yig'iladi va Telegram'ga yuboriladi.
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Video kerakmi?
        id: need
        run: |
          B="${{ github.event.before }}"
          if git cat-file -e "$B^{commit}" 2>/dev/null; then R="$B"; else R="HEAD~1"; fi
          if git diff --name-only "$R" HEAD | grep -q '^ARUmultiplatform/arumediatv-rs/video/'; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "video o'zgarmagan — o'tkazib yuboriladi"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.need.outputs.run == '1'
      - name: Haqiqiy ekranlar (snapshot, 2x)
        if: steps.need.outputs.run == '1'
        working-directory: ARUmultiplatform/arumediatv-rs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/snap"
          ARU_SNAPSHOT_SCALE=2 ARU_SNAPSHOT_DIR="$GITHUB_WORKSPACE/snap" cargo test bosh_sahifa
          ls "$GITHUB_WORKSPACE/snap" | wc -l
      - uses: actions/setup-python@v7
        if: steps.need.outputs.run == '1'
        with:
          python-version: '3.11'
      - name: Video yig'ish (ffmpeg)
        if: steps.need.outputs.run == '1'
        run: |
          sudo apt-get install -y -qq ffmpeg
          pip install --no-cache-dir -q pillow numpy
          mkdir -p out
          python ARUmultiplatform/arumediatv-rs/video/make_video.py "$GITHUB_WORKSPACE/snap" "out/arumediatvrs-animatsiya-${{ github.run_number }}.mp4"
          ls -la out
      - name: Videoni Telegram "Saqlangan xabarlar"ga yuborish
        if: steps.need.outputs.run == '1'
        continue-on-error: true
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          S="$RUNNER_TEMP/notify_session"
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
            -in tool/encode/session.enc -out "$S.session"
          head -c 16 "$S.session" | grep -q "SQLite format 3"
          for V in out/*.mp4; do
            python tool/notify/send_apk.py "$S" "$V" "ARUMEDIATVRS animatsiya prototipi (video) ${{ github.run_number }}"
          done
          rm -f "$S.session"
      - uses: actions/upload-artifact@v7
        if: steps.need.outputs.run == '1'
        with:
          name: arumediatvrs-animatsiya-${{ github.run_number }}
          path: out
          retention-days: 30
