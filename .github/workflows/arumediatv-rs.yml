name: ARUMEDIATV (Rust + uzcoders) — build va APK

# `ARUmultiplatform/arumediatv-rs/**` o'zgarganda: testlar -> faqat armeabi-v7a (32 bit) -> aapt2 bilan APK (Gradle'siz) -> Telegram.
# Kutubxona nusxasi `ARUmultiplatform/uzcoders` da (token kerak emas).
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/arumediatv-rs/**'
      - 'ARUmultiplatform/uzcoders/**'
      - 'ARUmultiplatform/android/rust/**'
      - '.github/workflows/arumediatv-rs.yml'

permissions:
  contents: read

concurrency:
  group: arumediatv-rs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `APP_SIGN_SECRET` (so'rov imzosi siri) Environment secret (android-native.yml bilan bir xil).
    environment: secret
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/arumediatv-rs -> target"

      - name: Testlar (kompyuterda, boshsiz)
        working-directory: ARUmultiplatform/arumediatv-rs
        run: cargo test

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Android uchun yig'ish
        working-directory: ARUmultiplatform/arumediatv-rs
        env:
          APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}
        run: |
          cargo ndk -t armeabi-v7a -o jniLibs build --release
          ls -la jniLibs/*/

      - name: APK yig'ish va imzolash (aapt2 + apksigner)
        id: apk
        working-directory: ARUmultiplatform/arumediatv-rs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          "$BT/aapt2" link -o base.apk -I "$PLAT/android.jar" --manifest AndroidManifest.xml \
            --min-sdk-version 21 --target-sdk-version 34 --version-code ${{ github.run_number }}
          # Java yelimi (klaviatura): javac + d8 (Android SDK'da bor), tashqi kutubxonasiz.
          mkdir -p classes dex
          javac --release 8 -cp "$PLAT/android.jar" -d classes $(find ../uzcoders/crates/uzcoders-android/java -name '*.java')
          "$BT/d8" --release --min-api 21 --lib "$PLAT/android.jar" --output dex $(find classes -name '*.class')
          (cd dex && zip -q ../base.apk classes.dex)
          mkdir -p apk/lib && cp -r jniLibs/* apk/lib/
          (cd apk && zip -q -r -0 ../base.apk lib)
          "$BT/zipalign" -p -f 4 base.apk aligned.apk
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          "$BT/apksigner" sign --ks ../../ci/release.keystore --ks-key-alias arumedia \
            --ks-pass pass:arumedia --key-pass pass:arumedia \
            --out "$OUT/arumediatv-rs-${{ github.run_number }}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"/*.apk | head -3
          unzip -l "$OUT"/*.apk | grep -E "libarumediatv|AndroidManifest|classes.dex"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: APK'ni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" "ARUMEDIATV Rust build ${{ github.run_number }}"
            rm -f "$S.session"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: arumediatv-rs-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30
