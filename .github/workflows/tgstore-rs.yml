name: tgstore-rs worker (Rust) — yig'ish, deploy, SQL tekshiruvi

# UZ: `ARUmultiplatform/tgstore/worker-rs/**` o'zgarganda: cargo test -> WASM yig'ish -> `tgstore-rs` worker deploy -> `/__sqlcheck`.
#     Production `arumediatv` ga tegilmaydi, cron yo'q.
# EN: On changes under `ARUmultiplatform/tgstore/worker-rs/**`: cargo test -> WASM build -> deploy `tgstore-rs` -> `/__sqlcheck`.
# RU: Pri izmenenii worker-rs: cargo test -> sborka WASM -> deploy `tgstore-rs` -> `/__sqlcheck`.
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/tgstore/worker-rs/**'
      - 'ARUmultiplatform/tgstore/bot.enc'
      - 'ARUmultiplatform/tgstore/channels.txt'
      - 'ARUmultiplatform/tgstore/supabase.enc'
      - 'ARUmultiplatform/tgstore/WIPE_ONCE'
      - 'ARUmultiplatform/tgstore/supabase/**'
      - '.github/workflows/tgstore-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgstore-rs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/tgstore/worker-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/tgstore/worker-rs -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Birlik testlari (bo'lak formati va hokazo)
        run: cargo test --lib kvfmt

      - name: worker-build va wrangler
        run: |
          cargo install worker-build --locked
          npm install -g wrangler

      - name: WASM yig'ish (SQLite WASM bilan)
        run: worker-build --release

      - name: Deploy va sirlar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}
          BOT_SECRET: ${{ secrets.TGSTORE_BOT_TOKEN }}
          SB_URL_SECRET: ${{ secrets.TGSTORE_SUPABASE_URL }}
          SB_KEY_SECRET: ${{ secrets.TGSTORE_SUPABASE_KEY }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          SK=$(printf '%s' "$K:tgstore" | sha256sum | cut -c1-32)
          echo "::add-mask::$SK"
          wrangler deploy
          printf '%s' "$SK" | wrangler secret put STORE_KEY
          # UZ: bot tokeni (bot.enc yoki TGSTORE_BOT_TOKEN secret) va kanallar (channels.txt): CHANNEL_ID = baza bo'laklari, MIRROR_CHANNEL_ID = fayl kanali.
          if [ -n "${BOT_SECRET:-}" ]; then BOT=$(printf '%s' "$BOT_SECRET" | tr -d '[:space:]')
          else BOT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../bot.enc | tr -d '[:space:]'); fi
          echo "::add-mask::$BOT"
          DB=$(grep -E '^CHANNEL_ID=' ../channels.txt | head -1 | cut -d= -f2- | tr -d '[:space:]')
          FL=$(grep -E '^MIRROR_CHANNEL_ID=' ../channels.txt | head -1 | cut -d= -f2- | tr -d '[:space:]')
          printf '%s' "$BOT" | wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$DB" | wrangler secret put KV_CHANNEL_ID
          printf '%s' "$FL" | wrangler secret put TG_CHANNEL_ID
          printf '%s' "$FL" | wrangler secret put VD_CHANNEL_ID
          # UZ: ro'yxat Supabase'da. `tgstore/supabase.enc` = JSON {"url","key"} (service_role; ENCODE_TOKEN bilan shifrlangan) yoki GitHub secret'lar
          #     TGSTORE_SUPABASE_URL / TGSTORE_SUPABASE_KEY. EN/RU: registry in Supabase; credentials from supabase.enc or secrets.
          SBU="${SB_URL_SECRET:-}"; SBK="${SB_KEY_SECRET:-}"
          if [ -z "$SBU" ] && [ -s ../supabase.enc ]; then
            SBJ=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../supabase.enc 2>/dev/null || true)
            SBU=$(printf '%s' "$SBJ" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            SBK=$(printf '%s' "$SBJ" | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])' 2>/dev/null || true)
          fi
          if [ -n "$SBU" ] && [ -n "$SBK" ]; then
            echo "::add-mask::$SBK"
            printf '%s' "$SBU" | wrangler secret put SUPABASE_URL
            printf '%s' "$SBK" | wrangler secret put SUPABASE_KEY
          else
            echo "⚠️  Supabase sirlari yo'q (supabase.enc / TGSTORE_SUPABASE_*) — kvdb va SQL sinovlari o'tkazib yuboriladi"
          fi
          # UZ: R2 (faqat fayl/rasm/video; baza R2'da EMAS) — production bilan bir xil kalitlar, lekin `tgstore/` prefiksida. EN/RU: R2 keys, own prefix.
          printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | tr -d '[:space:]' | wrangler secret put R2_ACCOUNT_ID
          if [ -f ../../../tool/r2/r2_keys.enc ]; then
            R2K=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../../../tool/r2/r2_keys.enc 2>/dev/null | tr -d '[:space:]' || true)
            case "$R2K" in *:*) printf '%s' "${R2K%%:*}" | wrangler secret put R2_ACCESS_KEY_ID; printf '%s' "${R2K#*:}" | wrangler secret put R2_SECRET_ACCESS_KEY ;; esac
          fi
          # UZ: ilova so'rov imzosi production bilan bir xil bo'lishi uchun. EN: same app-signature secret as production. RU: tot zhe sekret podpisi.
          if [ -n "$APP_SIGN_SECRET" ]; then printf '%s' "$APP_SIGN_SECRET" | wrangler secret put APP_SIGN_SECRET; fi
          # UZ: baza = Ample PostgreSQL darvozasi. Kalit hali o'rnatilmagan bo'lsa, birinchi chaqiruv o'rnatadi (`/setkey`). EN/RU: Ample PG gateway; key set on first call.
          GW=https://6m2yh3p3ufwq.ample.run
          curl -sS -m 30 -X POST "$GW/setkey" -d "{\"key\":\"$SK\"}" || true; echo
          printf '%s' "$GW" | wrangler secret put TURSO_URL
          printf '%s' "$SK" | wrangler secret put TURSO_TOKEN
          echo "KEY=$SK" >> "$GITHUB_ENV"

      - name: Xotiradagi SQLite WASM workerda ishlaydimi?
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          for i in $(seq 1 24); do
            C=$(curl -s -o /dev/null -w '%{http_code}' -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__sqlcheck" || true)
            echo "kutish $i: $C"; [ "$C" = "200" ] && break; sleep 5
          done
          curl -sS -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__sqlcheck" | tee /tmp/sqlcheck.json; echo
          python3 - <<'PY'
          import json,sys
          j=json.load(open('/tmp/sqlcheck.json'))
          print(json.dumps(j,indent=1,ensure_ascii=False))
          sys.exit(0 if j.get('ok') else 1)
          PY

      - name: Postgres (Ample) orqali haqiqiy so'rovlar tekshiruvi
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          FAIL=0
          for P in 1 2 3; do
            for i in $(seq 1 12); do
              C=$(curl -s -o /tmp/pg$P.json -m 90 -w '%{http_code}' -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__pgcheck?part=$P" || true)
              echo "bo'lak $P urinish $i: $C"; [ "$C" = "200" ] && break; sleep 10
            done
            python3 -c "import json,sys;j=json.load(open('/tmp/pg$P.json'));print(json.dumps(j,indent=1,ensure_ascii=False));sys.exit(0 if j.get('ok') else 1)" || FAIL=1
          done
          exit $FAIL

      - name: Doira tizimi quruq sinovi (sovuq qatorlar so'rovlari PostgreSQL'da ishlaydimi)
        if: always()
        continue-on-error: true
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          curl -sS -m 90 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__circle?force=1&dry=1" | tee /tmp/circle.json; echo

      - name: Katalog nusxasi (Telegram) - nashr va o'qish tekshiruvi
        if: always()
        continue-on-error: true
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          curl -sS -m 120 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__snap?publish=1&force=1" | tee /tmp/snap1.json; echo
          sleep 3
          curl -sS -m 60 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__snap?read=1" | tee /tmp/snap2.json; echo

      - name: "Bazani tozalash kerakmi? (bir martalik, fayl WIPE_ONCE)"
        if: env.SB == '1'
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          if [ -s ../WIPE_ONCE ]; then
            WID=$(tr -d '[:space:]' < ../WIPE_ONCE)
            echo "WIPE_ID=$WID" >> "$GITHUB_ENV"
            R=$(curl -sS -m 60 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__kv/wipe?id=$WID&check=1" || true)
            echo "tozalash holati: $R"
            case "$R" in *'"pending":true'*) echo "WIPE_PENDING=1" >> "$GITHUB_ENV" ;; esac
          fi

      - name: kvdb o'z-o'zini tekshirish (haqiqiy Telegram + Supabase bilan)
        if: env.SB == '1' && (env.WIPE_PENDING == '1' || github.event_name == 'workflow_dispatch')
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          S=$(date +%s)
          curl -sS -m 120 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__kv/selftest" | tee /tmp/kv.json; echo
          echo "devor vaqti: $(( $(date +%s) - S )) s"
          python3 - <<'PY'
          import json,sys
          j=json.load(open('/tmp/kv.json'))
          for s in j.get('steps',[]): print(('OK  ' if s['ok'] else 'XATO'), s['step'], '-', s['note'])
          if 'error' in j: print('XATO', j['error'])
          sys.exit(0 if j.get('ok') else 1)
          PY

      - name: SQL ko'prigi (production sxemasi va turso_* chaqiruvlari bo'laklar ustida)
        if: env.SB == '1' && (env.WIPE_PENDING == '1' || github.event_name == 'workflow_dispatch')
        run: |
          # UZ: Cloudflare bitta so'rovda cheklangan ichki chaqiruv beradi — sinov bosqichlarga bo'lingan. EN/RU: phases keep each call under the subrequest limit.
          URL=https://tgstore-rs.uzcom.workers.dev
          FAIL=0
          for PH in init write update config delete; do
            S=$(date +%s)
            curl -sS -m 300 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__kv/sqltest?phase=$PH" -o /tmp/sql_$PH.json || true
            echo "── bosqich: $PH ($(( $(date +%s) - S )) s)"
            python3 - "$PH" <<'PY' || FAIL=1
          import json,sys
          ph=sys.argv[1]
          try: j=json.load(open('/tmp/sql_%s.json'%ph))
          except Exception as e: print('XATO javob JSON emas:', open('/tmp/sql_%s.json'%ph).read()[:300]); sys.exit(1)
          for s in j.get('steps',[]): print(('OK  ' if s['ok'] else 'XATO'), s['step'], '-', s['note'])
          if 'error' in j: print('XATO', j['error'])
          sys.exit(0 if j.get('ok') else 1)
          PY
          done
          exit $FAIL

      # UZ: bir martalik TO'LIQ TOZALASH — Telegram'dagi hamma bo'lak fayllari va ro'yxat o'chadi; jadvallar va fayllar ilovadan birinchi foydalanishda O'ZI yaratiladi.
      #     Sinovlardan KEYIN ishlaydi (qoldiq qolmasin). `WIPE_ONCE` dagi raqam oshirilsa yana bir marta tozalanadi.
      # EN: one-shot FULL WIPE after the tests; bump the number in WIPE_ONCE to wipe again. RU: odnorazovaya polnaya ochistka.
      - name: Bazani to'liq tozalash (bir marta)
        if: env.SB == '1' && env.WIPE_PENDING == '1'
        run: |
          URL=https://tgstore-rs.uzcom.workers.dev
          for i in $(seq 1 30); do
            R=$(curl -sS -m 120 -A tgstore-ci -H "Authorization: Bearer $KEY" "$URL/__kv/wipe?id=$WIPE_ID" || true)
            echo "tozalash $i: $R"
            case "$R" in *'"done":true'*) exit 0 ;; esac
            sleep 2
          done
          echo "XATO: tozalash tugamadi"; exit 1
