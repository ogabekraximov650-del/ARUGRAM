name: Tashxis — avtoencode dublyaj run'i (vaqtinchalik)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: secret
    steps:
      - uses: actions/checkout@v4
      - name: Tekshirish
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: python3 tool/dub/check_runs.py
