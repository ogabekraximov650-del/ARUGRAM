name: Eski va yangi baza farqi (faqat o'qish)

# `tool/migrate/diff.txt` o'zgarganda: ikkala bazani solishtiradi va farqlar sonini chop etadi (hech narsa yozmaydi).
on:
  push:
    branches: [main]
    paths:
      - 'tool/migrate/diff.txt'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    environment: secret
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Farq
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python3 tool/migrate/diff.py
