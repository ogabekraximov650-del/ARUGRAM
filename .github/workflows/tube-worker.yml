name: ARUTUBE worker (Rust WASM) — deploy

# `ARUmultiplatform/tube/worker/**` o'zgarganda: tekshiruv + Cloudflare'ga deploy (worker nomi `arutube-api`).
# DoodStream kaliti — `worker/dood_key.enc` (ENCODE_TOKEN bilan shifrlangan) yoki GitHub Environment secret `DOOD_KEY` (kodga yozilmaydi); ilova tokeni — `APP_SIGN_SECRET` (APK bilan bir xil).
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/tube/worker/**'
      - '.github/workflows/tube-worker.yml'

permissions:
  contents: read

concurrency:
  group: tube-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/tube/worker
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/tube/worker -> target"

      - name: Testlar (xost) va wasm tekshiruvi
        run: |
          cargo test --lib
          cargo check --target wasm32-unknown-unknown

      - name: worker-build
        run: cargo install worker-build --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: wrangler
        run: npm install -g wrangler

      - name: Build (WASM)
        run: worker-build --release

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Sirlar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | wrangler secret put "$1"
            else
              echo "⚠️  $1 — GitHub'da yo'q, o'tkazib yuborildi (Cloudflare'dagi qiymat saqlanadi)"
            fi
          }
          # `dood_key.enc` (ENCODE_TOKEN bilan shifrlangan) bo'lsa u GitHub secret'dan USTUN turadi.
          DK="${{ secrets.DOOD_KEY }}"
          if [ -f dood_key.enc ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            D=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in dood_key.enc 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$D" ]; then DK="$D"; echo "✅ DOOD_KEY shifrlangan fayldan olindi"; else echo "⚠️  dood_key.enc ochilmadi"; fi
          fi
          put DOOD_KEY "$DK"
          put APP_TOKEN "${{ secrets.APP_SIGN_SECRET }}"
