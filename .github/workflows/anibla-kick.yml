name: Anibla yuklashni ishga tushirish (navbat to'xtab qolsa)


on:
  push:
    branches: [main]
    paths: ['ci/ANIBLA_KICK']

permissions:
  contents: read

concurrency:
  group: anibla-kick
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      # JONLI baza: worker `tool/migrate/new_turso.enc` dagi yangi bazani ishlatadi (deploy uni GitHub Secret'dan USTUN qo'yadi). Birinchi urinish
      # xato bilan ESKI (secret) bazani tozalagan edi — endi worker ishlatadigan baza tanlanadi. URL/token logda ko'rinmaydi.
      - name: Yuklashni ishga tushirish
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          curl -fsS -X POST -H "X-Encode-Token: $K" -H "Content-Type: application/json" -d '{}' "$API_BASE/api/anibla/kick" > "$RUNNER_TEMP/kick.json"
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["RUNNER_TEMP"] + "/kick.json"))
          neut = lambda x: str(x).replace("##[", "# [").replace("::", ": :")
          print("MSG:", d.get("msg"))
          print("RUNS:", [(r["id"], r["status"], r["conclusion"], r["created"]) for r in d.get("runs", [])])
          print("JOBS:", neut(json.dumps(d.get("latest_jobs"), ensure_ascii=False)))
          print("LOG_TAIL_BEGIN")
          print(neut(d.get("log_tail", "")))
          print("LOG_TAIL_END")
          PY
