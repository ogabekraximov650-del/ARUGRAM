# UZ: Ample jurnal-baza serveri (Rust, `ARUmultiplatform/ample-rs/`): testlar + release yig'ish (artifakt). EN: tests + release build of the Ample journal-store server. RU: тесты и сборка.
name: ample-rs (Rust) — testlar va yig'ish

on:
  push:
    paths:
      - 'ARUmultiplatform/ample-rs/**'
      - '.github/workflows/ample-rs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ARUmultiplatform/ample-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ARUmultiplatform/ample-rs
      - name: Testlar
        run: cargo test
      - name: Release yig'ish
        run: cargo build --release
      - name: Zaxira/tiklash E2E (soxta Telegram bilan)
        run: python3 -u tests/e2e.py target/release/tgstore-jr
      - uses: actions/upload-artifact@v7
        with:
          name: tgstore-jr-linux-x64
          path: ARUmultiplatform/ample-rs/target/release/tgstore-jr
