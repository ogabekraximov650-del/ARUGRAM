name: Deploy aniraxuzbot (Cloudflare Worker, TypeScript)

# `aniraxuzbot15/bot/**` o'zgarganda yoki `bot_token.enc` yangilanganda: bot tokeni ENCODE_TOKEN bilan ochilib
# `BOT_TOKEN` secret'iga qo'yiladi, worker `aniraxuzbot` deploy qilinadi va webhook o'rnatiladi.
# Hozircha ALOHIDA worker (`aniraxuzbot`); keyinroq arumediatv bilan birlashtirish mumkin.
on:
  push:
    branches: [main]
    paths:
      - 'aniraxuzbot15/bot/**'
      - 'tool/anibla/creds.enc'
      - 'tool/encode/gh_token.enc'
      - 'tool/encode/gh_repo.txt'
      - '.github/workflows/deploy-aniraxuzbot.yml'

concurrency:
  group: deploy-aniraxuzbot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # "Environment secrets" ga kirish uchun (deploy-worker.yml bilan bir xil).
    environment: secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bog'liqliklar
        working-directory: aniraxuzbot15/bot
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Tur tekshiruvi
        working-directory: aniraxuzbot15/bot
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Bot tokenini ochib secret'ga qo'yish
        working-directory: aniraxuzbot15/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TEZCHECK_TOKEN: ${{ secrets.TEZCHECK_TOKEN }}
          TEZCHECK_DESK: ${{ secrets.TEZCHECK_DESK }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          BT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in bot_token.enc 2>/dev/null | tr -d '[:space:]')
          if [ -z "$BT" ]; then
            echo "❌ bot_token.enc ochilmadi (ENCODE_TOKEN noto'g'ri?)"
            exit 1
          fi
          echo "::add-mask::$BT"
          # Worker bir marta deploy bo'lmagan bo'lsa secret qo'yish xato berishi mumkin — shunda avval deploy, keyin secret.
          if ! printf '%s' "$BT" | npx wrangler secret put BOT_TOKEN >/dev/null 2>&1; then
            echo "⚠️  secret birinchi urinishda qo'yilmadi — avval deploy qilinadi"
            npx wrangler deploy --keep-vars
            printf '%s' "$BT" | npx wrangler secret put BOT_TOKEN >/dev/null
          fi
          echo "✅ BOT_TOKEN o'rnatildi"
          # To'lov kalitlari: ilova bilan BIR XIL tezcheck kassasi (GitHub Secrets'dagi `TEZCHECK_TOKEN` / `TEZCHECK_DESK`).
          if [ -n "$TEZCHECK_TOKEN" ] && [ -n "$TEZCHECK_DESK" ]; then
            printf '%s' "$TEZCHECK_TOKEN" | npx wrangler secret put TEZCHECK_TOKEN >/dev/null
            printf '%s' "$TEZCHECK_DESK" | npx wrangler secret put TEZCHECK_DESK >/dev/null
            echo "✅ TEZCHECK_TOKEN / TEZCHECK_DESK o'rnatildi"
          else
            echo "⚠️  TEZCHECK_TOKEN/TEZCHECK_DESK secret'lari bo'sh — avto to'lov o'chiq qoladi"
          fi
          # Anibla orqali qism qo'shish: anibla.uz login/paroli (`tool/anibla/creds.enc`) va Actions ishga tushirish tokeni/repo'si
          # (`tool/encode/gh_token.enc`, `gh_repo.txt`) — hammasi ENCODE_TOKEN bilan ochiladi (ARUMEDIATV workeri bilan bir xil manba).
          if [ -f ../../tool/anibla/creds.enc ]; then
            AC=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../../tool/anibla/creds.enc 2>/dev/null || true)
            if printf '%s' "$AC" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["login"] and d["password"]' 2>/dev/null; then
              printf '%s' "$AC" | npx wrangler secret put ANIBLA_CREDS >/dev/null
              echo "✅ ANIBLA_CREDS o'rnatildi"
            else
              echo "⚠️  creds.enc ochilmadi — Anibla orqali qo'shish ishlamaydi"
            fi
          fi
          if [ -f ../../tool/encode/gh_token.enc ] && [ -f ../../tool/encode/gh_repo.txt ]; then
            GHT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../../tool/encode/gh_token.enc 2>/dev/null | tr -d '[:space:]')
            if [ -n "$GHT" ]; then
              echo "::add-mask::$GHT"
              GR=$(tr -d '[:space:]' < ../../tool/encode/gh_repo.txt)
              case "$GR" in
                */*) ;;
                *) GO=$(curl -fsS -H "Authorization: Bearer $GHT" -H "User-Agent: aniraxuzbot-deploy" \
                       https://api.github.com/user | python3 -c 'import json,sys; print(json.load(sys.stdin)["login"])' || true)
                   [ -n "$GO" ] && GR="$GO/${GR:-avtoencode}" || GR="" ;;
              esac
              if [ -n "$GR" ]; then
                printf '%s' "$GHT" | npx wrangler secret put GH_ACTIONS_TOKEN >/dev/null
                printf '%s' "$GR" | npx wrangler secret put GH_REPO >/dev/null
                echo "✅ GH_ACTIONS_TOKEN va GH_REPO o'rnatildi ($GR)"
              else
                echo "⚠️  token akkaunti aniqlanmadi — GH_REPO o'rnatilmadi"
              fi
            else
              echo "⚠️  gh_token.enc ochilmadi — Actions ishga tushirilmaydi"
            fi
          fi

      - name: Deploy
        working-directory: aniraxuzbot15/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars: Cloudflare'da avval o'rnatilgan o'zgaruvchilar (masalan TEZCHECK_API_KEY) o'chib ketmaydi.
        run: npx wrangler deploy --keep-vars

      - name: Webhook o'rnatish
        run: |
          sleep 5
          for i in 1 2 3; do
            R=$(curl -sS -m 30 "https://aniraxuz-bot.uzcom.workers.dev/setup" || true)
            echo "$R" | head -c 300; echo
            echo "$R" | grep -q '"ok":true' && exit 0
            sleep 8
          done
          echo "::error::webhook o'rnatilmadi — bot xabar olmaydi (/setup ni qayta oching)"
          exit 1
