name: ARUDRIVE Android (Kotlin + Compose) — build va testlar

# `ARUmultiplatform/drive/android/**` o'zgarganda: Kotlin testlari -> imzolangan APK -> Telegram "Saqlangan xabarlar".
# Yig'ish va testlar FAQAT shu yerda.
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/drive/android/**'
      - '.github/workflows/drive-android.yml'

permissions:
  contents: read

concurrency:
  group: drive-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `APP_SIGN_SECRET` — Environment secret (worker bilan bir xil).
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/drive/android
    env:
      VERSION_CODE: ${{ github.run_number }}
      APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Kotlin birlik testlari
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Imzolangan APK (release)
        id: apk
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$APP_SIGN_SECRET" ]; then echo "❌ APP_SIGN_SECRET yo'q"; exit 1; fi
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KS_FILE="$RUNNER_TEMP/release.keystore"
          fi
          N=${{ github.run_number }}
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$OUT/arudrive-$N.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$OUT/arudrive-$N.apk" | head -3
          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: APK'ni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" "ARUDRIVE build ${{ github.run_number }}: $(basename "$APK")"
            rm -f "$S.session"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: arudrive-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30
