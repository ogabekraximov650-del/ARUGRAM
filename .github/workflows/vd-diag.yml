name: Kanal tekshiruvi (vaqtinchalik)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vd-diag.yml']

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: secret
    steps:
      - name: Ikkala kanal va bot huquqlari
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          A = "https://arumediatv.uzcom.workers.dev"; T = os.environ["ENCODE_TOKEN"].strip()
          def call(p):
              r = urllib.request.Request(A + p, data=b"{}", method="POST", headers={"X-Encode-Token": T, "Content-Type": "application/json", "User-Agent": "arumediatv-diag"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as x: return json.loads(x.read())
              except Exception as e: return {"error": str(e)[:60]}
          v = {}
          for i in range(40):                       # deploy tugashini kutadi: "legacy" kaliti chiqquncha
              v = call("/api/vd/channel")
              if "legacy" in v: break
              time.sleep(15)
          print(json.dumps(v, indent=1, ensure_ascii=False))
          PY
# v2
