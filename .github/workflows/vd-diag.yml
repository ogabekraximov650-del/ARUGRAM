name: Bot webhook tekshiruvi (vaqtinchalik)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/vd-diag.yml']

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    steps:
      - name: Bot kirish va panel bot holati
        env:
          APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request, urllib.error
          A = "https://arumediatv.uzcom.workers.dev"; S = os.environ["APP_SIGN_SECRET"].strip()
          def signed(path, method="GET", body=None):
              ts = str(int(time.time()))
              sig = "v2.%s.%s" % (ts, hmac.new(S.encode(), ("%s.%s.%s" % (ts, method, path)).encode(), hashlib.sha256).hexdigest())
              r = urllib.request.Request(A + path, data=(json.dumps(body).encode() if body is not None else None), method=method,
                                         headers={"X-App-Sig": sig, "X-App-Version": "0.1.0+1", "Content-Type": "application/json", "User-Agent": "arumediatv-diag"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as x: return json.loads(x.read() or b"{}")
              except urllib.error.HTTPError as e: return {"http": e.code, "body": e.read()[:200].decode("utf8", "replace")}
          st = signed("/api/auth/telegram/start", "POST", {"device": "diag", "platform": "ci", "app_version": "0"})
          print("start:", {k: (v if k != "token" else "***") for k, v in st.items()})
          time.sleep(3)
          print("health:", signed("/api/auth/telegram/health"))
          with urllib.request.urlopen(A + "/api/telegram/encode-bot", timeout=60) as x: print("panel:", json.loads(x.read()))
          PY
