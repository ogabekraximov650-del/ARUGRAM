name: Debug probe (vaqtinchalik)

# Faqat qo'lda ishga tushadi. Admin so'rov yuborib ko'rish uchun — doimiy
# ishlatilmaydi, keyin o'chiriladi.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Tekshiriladigan manzil"
        required: true
        default: "https://api.yangi.tv/"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: So'rov
        run: |
          set -x
          URL="${{ inputs.url }}"
          echo "== GET $URL =="
          curl -sS -m 20 -D - -o /tmp/body "$URL" || true
          echo "== BODY (first 2000 bytes) =="
          head -c 2000 /tmp/body || true
          echo
          echo "== Common paths =="
          BASE="${URL%/}"
          for p in /api /api/v1 /health /ping /status /movies /films /search; do
            code=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" "$BASE$p" || echo "ERR")
            echo "$p -> $code"
          done
