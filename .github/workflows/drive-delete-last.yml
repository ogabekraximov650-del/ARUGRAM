name: ARUDRIVE oxirgi videoni o'chirish (bir martalik)

# Foydalanuvchi talabi: bazadagi eng oxirgi qo'shilgan bitta qator (bd_files) o'chiriladi. Faqat qo'lda ishga tushadi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  del:
    runs-on: ubuntu-latest
    environment: secret
    steps:
      - uses: actions/checkout@v4
      - name: Oxirgi qatorni o'chirish
        run: |
          K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
          S=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ARUmultiplatform/drive/worker/secrets.enc)
          U=$(printf '%s' "$S" | python3 -c 'import json,sys; print(json.load(sys.stdin)["BD_TURSO_URL"], end="")' | sed 's#^libsql://#https://#')
          T=$(printf '%s' "$S" | python3 -c 'import json,sys; print(json.load(sys.stdin)["BD_TURSO_TOKEN"], end="")')
          q() { curl -sS -X POST "$U/v2/pipeline" -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
                 -d "{\"requests\":[{\"type\":\"execute\",\"stmt\":{\"sql\":\"$1\"}},{\"type\":\"close\"}]}" | python3 -c 'import json,sys; r=json.load(sys.stdin)["results"][0]; x=r.get("response",{}).get("result"); print(json.dumps(x["rows"] if x else r, ensure_ascii=False), "affected=", x and x.get("affected_row_count"))'; }
          echo "Eng oxirgi qator:"; q "SELECT id,name,state,created FROM bd_files ORDER BY created DESC LIMIT 1"
          q "DELETE FROM bd_files WHERE id=(SELECT id FROM bd_files ORDER BY created DESC LIMIT 1)"
          echo "Keyin:"; q "SELECT COUNT(*) FROM bd_files"
