name: Kanal xabarlarini ko'rish (faqat o'qish)


on:
  push:
    branches: [main]
    paths: ['ci/TG_PEEK']

permissions:
  contents: read

concurrency:
  group: tg-peek
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      # JONLI baza: worker `tool/migrate/new_turso.enc` dagi yangi bazani ishlatadi (deploy uni GitHub Secret'dan USTUN qo'yadi). Birinchi urinish
      # xato bilan ESKI (secret) bazani tozalagan edi — endi worker ishlatadigan baza tanlanadi. URL/token logda ko'rinmaydi.
      - name: Jonli baza ulanishi
        env:
          OLD_URL: ${{ secrets.TURSO_URL }}
          OLD_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          U="$OLD_URL"; T="$OLD_TOKEN"; SRC="secret"
          if [ -f tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then U="$NU"; T="$NK"; SRC="new_turso.enc"; fi
          fi
          # ASOSIY ma'lumotlar AMPLE bazasida (`tool/migrate/ample.enc`, worker `db_endpoint`) — Turso'da faqat post/anibla navbatlari. Shuning uchun Ample ustun.
          if [ -f tool/migrate/ample.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            AT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/ample.enc 2>/dev/null || true)
            AU=$(printf '%s' "$AT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            AK=$(printf '%s' "$AT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$AU" ] && [ -n "$AK" ]; then U="${AU%/}"; T="$AK"; SRC="ample.enc"; fi
          fi
          echo "::add-mask::$U"; echo "::add-mask::$T"
          echo "TURSO_URL=$U" >> "$GITHUB_ENV"; echo "TURSO_TOKEN=$T" >> "$GITHUB_ENV"
          echo "Baza manbasi: $SRC"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Python paketlari
        run: pip install --no-cache-dir pyrogram==2.0.106 tgcrypto==1.2.5
      - name: Telegram sessiyasi (kanal egasi)
        run: |
          OUT="$RUNNER_TEMP/pyro_session.session"
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/encode/session.enc -out "$OUT"
          head -c 16 "$OUT" | grep -q "SQLite format 3"
          echo "SESSION_PATH=$RUNNER_TEMP/pyro_session" >> "$GITHUB_ENV"
      - name: ffmpeg (ffprobe)
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Kanal xabarlari
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python3 ci/tg_peek.py
      - name: Sessiyani o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/pyro_session.session"
