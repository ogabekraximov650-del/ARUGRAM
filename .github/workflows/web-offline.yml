name: Mini App saytini o'chirish (arumediatv.pages.dev)

# `.github/web-offline.txt` o'zgarsa: Cloudflare Pages loyihasi `arumediatv` o'chiriladi (bor bo'lsa).
# Qayta yoqish: deploy-web.yml ni "Run workflow" bilan ishga tushiring — loyiha o'zi qayta yaratiladi.
# Kerak: CLOUDFLARE_API_TOKEN va CLOUDFLARE_ACCOUNT_ID (boshqa deploy'lardagi o'sha secret'lar).

on:
  push:
    branches: [main]
    paths:
      - '.github/web-offline.txt'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pages loyihasini o'chirish (bo'lmasa o'tkazib yuboriladi)
        run: |
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qw arumediatv; then
            npx --yes wrangler@3 pages project delete arumediatv --yes
            echo "Loyiha o'chirildi"
          else
            echo "Loyiha yo'q"
          fi
