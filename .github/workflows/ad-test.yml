name: Reklama sinovi (emulyator)

# UZ: AdMob reklamasi yuklanayotganini emulyatorda tekshiradi (sinov va haqiqiy blok). Faqat `ARUmultiplatform/adtest/**` yoki shu fayl o'zgarganda ishlaydi.
# Eslatma: emulyator AdMob uchun "sinov qurilma" hisoblanadi — haqiqiy telefondagi "No fill" (kod 3) ni ko'rsatmaydi, lekin sozlama/ID xatolarini aniqlaydi.
# EN: checks AdMob loading on a CI emulator; RU: proverka zagruzki AdMob na emulyatore CI.
on:
  push:
    paths:
      - 'ARUmultiplatform/adtest/**'
      - '.github/workflows/ad-test.yml'

jobs:
  adtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'

      - name: ADTEST APK yig'ish
        working-directory: ARUmultiplatform/adtest
        run: gradle --no-daemon :app:assembleDebug

      - name: KVM (emulyator tezligi uchun)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulyatorda reklamani sinash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ARUmultiplatform/adtest/run.sh
