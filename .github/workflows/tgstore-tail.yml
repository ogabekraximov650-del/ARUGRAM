name: tgstore-rs jurnal (tail) — xatolarni jonli ko'rish

# UZ: QO'LDA ishga tushiriladi (`workflow_dispatch`). `tgstore-rs` worker jurnalini N daqiqa davomida yig'adi va chop etadi: shu vaqt ichida ilovada
#     xatoga olib keladigan amalni takrorlang. Faqat xato va ogohlantirishlar (`aru_tq`/`aru_sv` hisob qatorlari filtrlanadi).
# EN: MANUAL. Collects the worker log for N minutes; repeat the failing action in the app meanwhile.
# RU: Ruchnoy zapusk. Sobiraet zhurnal worker'a N minut.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Necha daqiqa kuzatish'
        default: '4'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: secret
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Jurnal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          echo "Kuzatish boshlandi: $(date -u +%H:%M:%S) UTC, $MINUTES daqiqa. Ilovada amalni takrorlang."
          timeout $(( MINUTES * 60 )) wrangler tail tgstore-rs --format json 2>&1 | python3 -u -c '
          import sys,json
          for line in sys.stdin:
              line=line.strip()
              if not line: continue
              try: e=json.loads(line)
              except Exception: print(line[:400]); continue
              req=e.get("event",{}).get("request",{})
              resp=e.get("event",{}).get("response",{})
              url=req.get("url","").replace("https://tgstore-rs.uzcom.workers.dev","")
              logs=[ " ".join(str(x) for x in l.get("message",[]))[:300] for l in e.get("logs",[]) if not " ".join(str(x) for x in l.get("message",[])).startswith(("aru_tq","aru_sv"))]
              exc=[ (x.get("name","")+": "+str(x.get("message",""))[:400]) for x in e.get("exceptions",[])]
              print(e.get("outcome"), resp.get("status"), req.get("method"), url[:110], "| CPU:",e.get("cpuTime"), "ms | wall:", e.get("wallTime"), "ms")
              for l in logs: print("   log:", l)
              for x in exc: print("   EXC:", x)
          ' || true
