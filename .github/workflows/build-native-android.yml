name: Native Android (Kotlin + Compose + Rust)

# ARUmultiplatform/android — Flutter ilovasidan ALOHIDA native nusxa.
# Tekshiruv shu yerda (GitHub Actions), mahalliy muhitda emas.
# Faqat shu papka o'zgarsa ishga tushadi; eski ilova workflow'iga tegmaydi.
#
# Server manzili: `NATIVE_API_BASE` secret'i (YANGI worker). Eski ilova
# ishlatadigan manzilga bu workflow hech qachon tegmaydi.

on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/android/**'
      - '.github/workflows/build-native-android.yml'
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ARUmultiplatform/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK va NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ARUmultiplatform/android/rust

      - name: Rust testlari
        working-directory: ARUmultiplatform/android/rust
        run: cargo test --lib

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin testlari va debug APK
        env:
          NATIVE_API_BASE: ${{ secrets.NATIVE_API_BASE }}
        run: |
          ./gradlew --no-daemon \
            ${NATIVE_API_BASE:+-PAPI_BASE="$NATIVE_API_BASE"} \
            :app:testDebugUnitTest :app:assembleDebug

      - name: APK ichida Rust yadro bormi
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/librust_core.so'

      - uses: actions/upload-artifact@v4
        with:
          name: aru-native-debug-apk
          path: ARUmultiplatform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
