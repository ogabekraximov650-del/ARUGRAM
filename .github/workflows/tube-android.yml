name: ARUTUBE Android (Kotlin + Compose + Rust) — build va testlar

# `ARUmultiplatform/tube/android/**` o'zgarganda: Rust yadrosi testlari -> .so (arm64 + armeabi) -> Kotlin testlari -> imzolangan APK.
# Yig'ish va testlar FAQAT shu yerda (mahalliy muhitga hech narsa o'rnatilmaydi).
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/tube/android/**'
      - '.github/workflows/tube-android.yml'

permissions:
  contents: read

concurrency:
  group: tube-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/tube/android
    env:
      VERSION_CODE: ${{ github.run_number }}
      APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust (stable + Android targetlari)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/tube/android/rust -> target"

      - name: Rust testlari (xost)
        working-directory: ARUmultiplatform/tube/android/rust
        run: cargo test --lib

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust yadrosini Android uchun yig'ish
        working-directory: ARUmultiplatform/tube/android/rust
        run: |
          cargo ndk -t armeabi-v7a -t arm64-v8a -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/*/

      # 16 KB sahifali qurilmalar (Android 15+): 64 bitli .so LOAD segmentlari 16 KB ga tekislangan bo'lishi shart.
      - name: 16 KB tekislash tekshiruvi
        run: |
          SO="app/src/main/jniLibs/arm64-v8a/libtube_core.so"
          READELF=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -1)
          [ -z "$READELF" ] && READELF=$(ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -1)
          [ -z "$READELF" ] && READELF=readelf
          "$READELF" -lW "$SO" | grep LOAD
          if "$READELF" -lW "$SO" | awk '$1=="LOAD" {print $NF}' | grep -qvE '0x(4000|8000|10000)'; then
            echo "❌ libtube_core.so 16 KB ga tekislanmagan"; exit 1
          fi
          echo "✅ 16 KB tekislangan"

      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Kotlin birlik testlari
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Imzolangan APK (release)
        id: apk
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KS_FILE="$RUNNER_TEMP/release.keystore"
          fi
          N=${{ github.run_number }}
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$OUT/arutube-$N.apk"
          for f in "$OUT"/*.apk; do
            echo "== $f"; ls -la "$f"
            "$APKSIGNER" verify --print-certs "$f" | head -3
            unzip -l "$f" | grep -E "libtube_core" || true
          done
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: arutube-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30

      # APK ni Telegram "Saqlangan xabarlar"ga yuborish (android-native.yml'dagidek). Xato bo'lsa build buzilmaydi.
      - name: APK ni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" "ARUTUBE Android build ${{ github.run_number }}: $(basename "$APK")"
            rm -f "$S.session"
          done
