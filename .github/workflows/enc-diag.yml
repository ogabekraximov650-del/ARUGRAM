name: Kodlash navbati tashxisi (faqat o'qish)

# Qo'lda ishga tushadi. Jonli bazani (`tool/migrate/new_turso.enc`) FAQAT O'QIYDI: jadval/ustun/indeks/qator sonlari. Qiymatlar chiqarilmaydi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Jonli baza ulanishi
        env:
          OLD_URL: ${{ secrets.TURSO_URL }}
          OLD_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          U="$OLD_URL"; T="$OLD_TOKEN"
          if [ -f tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then U="$NU"; T="$NK"; fi
          fi
          echo "::add-mask::$U"; echo "::add-mask::$T"
          echo "TURSO_URL=$U" >> "$GITHUB_ENV"; echo "TURSO_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Tashxis
        run: python3 ci/enc_diag.py
      - name: Jonli holat (qdiag, faqat o'qish)
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
        run: |
          T=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          curl -sS -m 60 -X POST -H "X-Encode-Token: $T" -H "Content-Type: application/json" -d '{}' "$API_BASE/api/encode/qdiag" \
            | python3 -c 'import json,sys,time; d=json.load(sys.stdin); print("live_keys:", d.get("live_keys")); [print("LIVE", k, v.get("age_s"), "s |", (v.get("head") or "").replace(chr(10), " / ")[:420]) for k, v in (d.get("live_info") or {}).items()]; print("now:", d.get("now")); print("q_states:", d.get("q_states")); print("pending:", d.get("pending")); print("holat:", (d.get("holat") or "")[:2500])'
      - name: vd verify (ochilish tekshiruvi, faqat o'qish)
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
        run: |
          T=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          for n in ep_4_1_1_360p_1794242367764.mp4 sys_emojifont_1794244734.bin; do
            echo "== verify $n"
            curl -sS -m 90 -w "  [HTTP %{http_code}]\n" -X POST -H "X-Encode-Token: $T" -H "Content-Type: application/json" -d "{\"name\":\"$n\"}" "$API_BASE/api/vd/verify" | sed 's/"key":"[0-9a-f]*"/"key":"<yashirin>"/'
          done
          echo "== channel"
          curl -sS -m 60 -X POST -H "X-Encode-Token: $T" -H "Content-Type: application/json" -d '{}' "$API_BASE/api/vd/channel"; echo
      - name: Ilova yo'li (imzolangan so'rovlar, faqat o'qish)
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
          SECRET: ${{ secrets.APP_SIGN_SECRET }}
        run: |
          sig() { ts=$(date +%s); mac=$(printf '%s' "$ts.$1.$2" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $NF}'); printf 'v2.%s.%s' "$ts" "$mac"; }
          EP=ep_4_1_1_360p_1794242367764.mp4; FONT=sys_emojifont_1794244734.bin
          echo "== warm vd~$EP w=0"
          curl -sS -m 120 -w "  [HTTP %{http_code} %{time_total}s]\n" -H "X-App-Sig: $(sig GET /api/warm/vd~$EP)" "$API_BASE/api/warm/vd~$EP?w=0"
          echo "== play vd~$EP Range 0-1023"
          curl -sS -m 60 -o /tmp/p.bin -D /tmp/h.txt -w "  [HTTP %{http_code} %{size_download} bayt %{time_total}s]\n" -H "Range: bytes=0-1023" -H "X-App-Sig: $(sig GET /api/play/vd~$EP)" "$API_BASE/api/play/vd~$EP"; cat /tmp/h.txt; echo "--- body:"; head -c 200 /tmp/p.bin | tr -c '[:print:]\n' '.'; echo
          echo "== play (2-nchi urinish, warm'dan keyin)"
          curl -sS -m 120 -o /dev/null "$API_BASE/api/warm/vd~$EP?w=0" -H "X-App-Sig: $(sig GET /api/warm/vd~$EP)"
          curl -sS -m 60 -o /tmp/p2.bin -D /tmp/h3.txt -w "  [HTTP %{http_code} %{size_download} bayt]\n" -H "Range: bytes=0-1023" -H "X-App-Sig: $(sig GET /api/play/vd~$EP)" "$API_BASE/api/play/vd~$EP"; grep -i -E "^HTTP|x-warm|x-cache|content-range" /tmp/h3.txt
          echo "== imginfo $FONT"
          curl -sS -m 30 -w "  [HTTP %{http_code}]\n" -X POST -H "X-App-Sig: $(sig POST /api/vd/imginfo)" -H "Content-Type: application/json" -d "{\"names\":[\"$FONT\"]}" "$API_BASE/api/vd/imginfo" | sed 's/"key":"[0-9a-f]*"/"key":"<yashirin>"/'
          echo "== img $FONT"
          curl -sS -m 60 -o /tmp/f.bin -D /tmp/h2.txt -w "  [HTTP %{http_code} %{size_download} bayt %{time_total}s]\n" -H "X-App-Sig: $(sig GET /api/vd/img/$FONT)" "$API_BASE/api/vd/img/$FONT"; grep -i -E "^HTTP|content-length" /tmp/h2.txt
