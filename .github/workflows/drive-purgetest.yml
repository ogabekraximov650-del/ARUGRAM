name: ARUDRIVE purgetest (vaqtinchalik)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    environment: secret
    steps:
      - name: Kesh sinovi
        run: |
          K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
          U=https://arudrive.uzcom.workers.dev
          g() { curl -sS -D- -o /tmp/b -H "X-Encode-Token: $K" "$1" | grep -iE '^(HTTP/|cf-cache|age|x-gen)' | tr '\n' ' '; python3 -c 'import json;print("gen=",json.load(open("/tmp/b")).get("gen"))' 2>/dev/null || echo; }
          P=$(curl -sS -X POST -H "X-Encode-Token: $K" "$U/api/bd/purgetest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')
          sleep 3
          echo "== TO'G'RIDAN-TO'G'RI ichki manzil"; g "$U$P"; g "$U$P"
          echo "purge:"; curl -sS -X POST -H "X-Encode-Token: $K" "$U/api/bd/purgetest"; echo
          g "$U$P"; sleep 5; g "$U$P"
          echo "== /api/bd/list (SELF orqali)"; g "$U/api/bd/list"; g "$U/api/bd/list"
          curl -sS -X POST -H "X-Encode-Token: $K" "$U/api/bd/purgetest" >/dev/null
          g "$U/api/bd/list"; sleep 5; g "$U/api/bd/list"
