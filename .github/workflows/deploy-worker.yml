name: Deploy Cloudflare Worker (Rust WASM)

on:
  # worker/ papkasiga o'zgartirish push qilinganda AVTOMATIK deploy
  # qiladi (masalan main branchga). Qo'lda ham ishga tushirish mumkin —
  # GitHub Actions sahifasida "Run workflow" tugmasi orqali.
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'ci/WIPE_DB_ONCE'
      - 'tool/anibla/creds.enc'
      - 'tool/announce/channel.enc'
      - 'tool/encode/gh_token.enc'
      - 'tool/encode/gh_repo.txt'
      - 'tool/bot/main_bot.enc'
      - 'tool/bot/encode_bot.enc'
      - 'tool/migrate/new_turso.enc'
      - 'tool/r2/r2_keys.enc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # MUHIM: "Environment secrets" ga kirish uchun job aynan shu
    # environment nomini e'lon qilishi shart — aks holda secrets bo'sh bo'ladi.
    environment: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "worker -> target"

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build Rust Worker (→ WASM)
        working-directory: worker
        run: worker-build --release

      # ── YANGI WORKER NOMI: oldindan deploy ─────────────────────
      #
      # Worker nomi o'zgarganda (`arumediatv` -> `arumediatv`) yangi nom ostida worker hali yo'q, `wrangler secret put` esa mavjud
      # worker'ga yoziladi. Shu sabab avval oddiy deploy qilinadi. Shu nomli ESKI worker bo'lsa va uning Durable Object
      # migratsiyalari bizning zanjirga mos kelmasa (deploy yiqilsa) — eski worker O'CHIRILADI (foydalanuvchi talabi:
      # eskisi kerak emas, ustiga deploy qilinsin) va qayta deploy qilinadi.
      - name: Worker mavjudligini ta'minlash
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if wrangler deploy --env production; then
            echo "✅ worker deploy qilindi"
          else
            echo "⚠️  deploy yiqildi — shu nomli eski worker o'chirilib, qayta deploy qilinadi"
            wrangler delete --name arumediatv --force || true
            wrangler deploy --env production
          fi

      - name: Upload Worker Secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # ── BO'SH SIR TIRIK SIRNI O'CHIRIB YUBORMASIN ──────
          #
          # TOPILGAN XAVF: bu qadam HAR deployda sirlarni qaytadan
          # yozadi. Agar biror sir GitHub'da yo'q bo'lsa (masalan
          # `wrangler secret put` bilan QO'LDA qo'yilgan bo'lsa),
          # `printf '%s' ""` uni BO'SH qiymat bilan almashtirardi —
          # va to'lovlar jimgina ishlamay qolardi.
          #
          # Endi bo'sh sir shunchaki o'tkazib yuboriladi: qo'lda
          # qo'yilgan qiymat joyida qoladi.
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | wrangler secret put "$1" --env production
            else
              echo "⚠️  $1 — GitHub'da yo'q, o'tkazib yuborildi (Cloudflare'dagi qiymat saqlanadi)"
            fi
          }
          put TURSO_URL "${{ secrets.TURSO_URL }}"
          put TURSO_TOKEN "${{ secrets.TURSO_TOKEN }}"
          # Yangi Turso bazasi: `tool/migrate/new_turso.enc` (JSON {"url","token"}, AES-256-CBC/PBKDF2, kalit — ENCODE_TOKEN)
          # bo'lsa GitHub Secret'dagi (eski) qiymatdan USTUN turadi. Ochilmasa — eski qiymat saqlanadi.
          if [ -f ../tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ../tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then
              put TURSO_URL "$NU"
              put TURSO_TOKEN "$NK"
              echo "✅ TURSO_URL/TURSO_TOKEN yangi bazadan (shifrlangan fayl) o'rnatildi"
            else
              echo "⚠️  new_turso.enc ochilmadi — eski TURSO qiymatlari saqlanadi"
            fi
          fi
          put B2_KEY_ID "${{ secrets.B2_KEY_ID }}"
          put B2_APPLICATION_KEY "${{ secrets.B2_APPLICATION_KEY }}"
          # tezcheck.uz — balans to'ldirish to'lov havolalari uchun.
          put TEZCHECK_TOKEN "${{ secrets.TEZCHECK_TOKEN }}"
          put TEZCHECK_DESK "${{ secrets.TEZCHECK_DESK }}"
          # Webhook siri ixtiyoriy — qo'yilmasa webhook o'chiq turadi.
          put TEZCHECK_WEBHOOK_SECRET "${{ secrets.TEZCHECK_WEBHOOK_SECRET }}"
          # So'rov imzosining siri. AYNAN shu qiymat APK'ni yig'ishda
          # ham berilishi shart (`build-flutter-apk.yml`), aks holda
          # ilovaning hamma so'rovi 403 oladi.
          put APP_SIGN_SECRET "${{ secrets.APP_SIGN_SECRET }}"
          # Telegram orqali video (`worker/src/lib.rs` -> `tg_route`).
          # Uchalasi ham qo'yilmasa ilova odatdagidek B2'dan ishlaydi.
          put TG_API_ID "${{ secrets.TG_API_ID }}"
          put TG_API_HASH "${{ secrets.TG_API_HASH }}"
          put TG_CHANNEL_ID "${{ secrets.TG_CHANNEL_ID }}"
          # Avto-kodlash (`encode.yml`): Actions shu kalit bilan kiradi.
          put ENCODE_TOKEN "${{ secrets.ENCODE_TOKEN }}"
          # Kodlash boti (qism qo'shish, faqat admin) — @BotFather tokeni.
          # Bot yopiq kanalda ADMIN bo'lishi shart.
          put ENCODE_BOT_TOKEN "${{ secrets.ENCODE_BOT_TOKEN }}"
          # Cron `encode.yml` ni o'zi ishga tushirishi uchun: fine-grained
          # token, faqat shu repo, "Actions: Read and write".
          put GH_ACTIONS_TOKEN "${{ secrets.GH_ACTIONS_TOKEN }}"
          # Admin paneli GitHub run qadamlarini O'ZI so'rashi uchun: fine-grained
          # token, faqat kodlash repo'si, "Actions: Read-only" (yozish YO'Q).
          # Faqat admin so'rovida ilovaga beriladi (`/api/encode/live`).
          put GH_READ_TOKEN "${{ secrets.GH_READ_TOKEN }}"
          # Kodlash boshqa akkauntdagi repoda bo'lsa: shu repodagi
          # `tool/encode/gh_token.enc` (ENCODE_TOKEN bilan shifrlangan
          # token) ochiladi va yuqoridagini ALMASHTIRADI; repo nomi
          # `tool/encode/gh_repo.txt` dan (`owner/repo`).
          # Token almashsa `gh_token.enc` yangilanadi va shu fayl o'zgarib deploy ishga tushadi.
          # anibla.uz login/paroli (`worker/src/anibla.rs`): `tool/anibla/creds.enc`
          # (AES-256-CBC, PBKDF2) `ENCODE_TOKEN` bilan ochiladi (`gh_token.enc`,
          # `session.enc` kabi; alohida `ANIBLA_KEY` qo'yilsa — o'sha) va worker'ga
          # `ANIBLA_CREDS` (JSON) bo'lib qo'yiladi. Ochilmasa — eski qiymat saqlanadi.
          if [ -f ../tool/anibla/creds.enc ]; then
            AK=$(printf '%s' "${{ secrets.ANIBLA_KEY || secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            AC=""
            if [ -n "$AK" ]; then
              AC=$(K="$AK" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
                -in ../tool/anibla/creds.enc 2>/dev/null || true)
            fi
            if printf '%s' "$AC" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["login"] and d["password"]' 2>/dev/null; then
              put ANIBLA_CREDS "$AC"
              echo "✅ ANIBLA_CREDS shifrlangan fayldan o'rnatildi"
            else
              echo "⚠️  creds.enc ochilmadi (kalit noto'g'ri) — eski ANIBLA_CREDS saqlanadi"
            fi
          fi
          # Yangi qism e'lon qilinadigan kanal (`worker/src/announce.rs`): `tool/announce/channel.enc`
          # (JSON `{"channel_id": -100...}`, AES-256-CBC, PBKDF2) `ENCODE_TOKEN` bilan ochiladi va
          # `ANNOUNCE_CHANNEL` bo'lib qo'yiladi. Ochilmasa — eski qiymat saqlanadi.
          if [ -f ../tool/announce/channel.enc ]; then
            NK=$(printf '%s' "${{ secrets.ANNOUNCE_KEY || secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            NC=""
            if [ -n "$NK" ]; then
              NC=$(K="$NK" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
                -in ../tool/announce/channel.enc 2>/dev/null || true)
            fi
            if printf '%s' "$NC" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert int(d["channel_id"]) != 0' 2>/dev/null; then
              put ANNOUNCE_CHANNEL "$NC"
              echo "✅ ANNOUNCE_CHANNEL shifrlangan fayldan o'rnatildi"
            else
              echo "⚠️  channel.enc ochilmadi (kalit noto'g'ri) — eski ANNOUNCE_CHANNEL saqlanadi"
            fi
          fi
          if [ -f ../tool/encode/gh_token.enc ] && [ -f ../tool/encode/gh_repo.txt ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            GHT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in ../tool/encode/gh_token.enc 2>/dev/null | tr -d '[:space:]')
            if [ -n "$GHT" ]; then
              put GH_ACTIONS_TOKEN "$GHT"
              # `gh_repo.txt` da faqat repo nomi bo'lsa — egasi token akkauntidan.
              GR=$(tr -d '[:space:]' < ../tool/encode/gh_repo.txt)
              case "$GR" in
                */*) ;;
                *) GO=$(curl -fsS -H "Authorization: Bearer $GHT" -H "User-Agent: arumediatv-deploy" \
                       https://api.github.com/user | python3 -c 'import json,sys; print(json.load(sys.stdin)["login"])' || true)
                   [ -n "$GO" ] && GR="$GO/${GR:-avtoencode}" || GR="" ;;
              esac
              if [ -n "$GR" ]; then put GH_REPO "$GR"; echo "GH_REPO: $GR"; else echo "⚠️  token akkaunti aniqlanmadi — eski GH_REPO saqlanadi"; fi
              echo "✅ GH_ACTIONS_TOKEN va GH_REPO shifrlangan fayldan o'rnatildi"
            else
              echo "⚠️  gh_token.enc ochilmadi — eski GH_ACTIONS_TOKEN saqlanadi"
            fi
          fi
          # R2 to'g'ridan-to'g'ri rejimi (`worker/src/r2.rs`): S3 kalitlari `tool/r2/r2_keys.enc` da (`ACCESS_KEY_ID:SECRET`,
          # AES-256-CBC, PBKDF2, kalit `ENCODE_TOKEN`) yoki GitHub secret'lar `R2_ACCESS_KEY_ID` / `R2_SECRET_ACCESS_KEY` da.
          # Shunda worker imzolangan havolalar beradi va fayl baytlari worker'dan O'TMAYDI. Kalit yo'q bo'lsa — worker binding orqali.
          put R2_ACCOUNT_ID "$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | tr -d '[:space:]')"
          R2K=""
          if [ -f ../tool/r2/r2_keys.enc ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            R2K=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in ../tool/r2/r2_keys.enc 2>/dev/null | tr -d '[:space:]')
          fi
          if [ -z "$R2K" ] && [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]; then
            R2K="${{ secrets.R2_ACCESS_KEY_ID }}:${{ secrets.R2_SECRET_ACCESS_KEY }}"
          fi
          case "$R2K" in
            *:*) put R2_ACCESS_KEY_ID "${R2K%%:*}"; put R2_SECRET_ACCESS_KEY "${R2K#*:}"
                 echo "✅ R2 kalitlari o'rnatildi (to'g'ridan-to'g'ri rejim)" ;;
            *) echo "⚠️  R2 kalitlari yo'q — worker binding orqali ishlaydi" ;;
          esac
          # Asosiy bot (`TELEGRAM_BOT_TOKEN`): `tool/bot/main_bot.enc` (AES-256-CBC, PBKDF2),
          # `ENCODE_TOKEN` bilan ochiladi. Bot almashsa shu fayl qayta shifrlanadi.
          if [ -f ../tool/bot/main_bot.enc ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            MB=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in ../tool/bot/main_bot.enc 2>/dev/null | tr -d '[:space:]')
            if [ -n "$MB" ]; then
              put TELEGRAM_BOT_TOKEN "$MB"
              echo "✅ TELEGRAM_BOT_TOKEN shifrlangan fayldan o'rnatildi"
            else
              echo "⚠️  main_bot.enc ochilmadi — eski TELEGRAM_BOT_TOKEN saqlanadi"
            fi
          fi
          # Kodlash boti (`ENCODE_BOT_TOKEN`): `tool/bot/encode_bot.enc` (AES-256-CBC, PBKDF2),
          # `ENCODE_TOKEN` bilan ochiladi; bo'lsa GitHub Secret'dagi qiymatdan USTUN turadi.
          if [ -f ../tool/bot/encode_bot.enc ]; then
            K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
            EB=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in ../tool/bot/encode_bot.enc 2>/dev/null | tr -d '[:space:]')
            if [ -n "$EB" ]; then
              put ENCODE_BOT_TOKEN "$EB"
              echo "✅ ENCODE_BOT_TOKEN shifrlangan fayldan o'rnatildi"
            else
              echo "⚠️  encode_bot.enc ochilmadi — eski ENCODE_BOT_TOKEN saqlanadi"
            fi
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # R2 oraliq ombori (`worker/src/r2.rs`): worker o'z binding'i bilan `arumediatv` bucket'iga ulanadi — hech qanday
          # R2/S3 kaliti kerak emas. Binding deploy paytida qo'shiladi; qo'shib bo'lmasa (ruxsat/bucket yo'q) — binding'siz
          # deploy (R2 o'chiq, run'lar eski usulda yuklaydi), shunda boshqa hech narsa buzilmaydi.
          cp wrangler.toml wrangler.toml.bak
          printf '\n[[env.production.r2_buckets]]\nbinding = "R2"\nbucket_name = "arumediatv"\n' >> wrangler.toml
          if wrangler deploy --env production; then
            echo "✅ R2 binding bilan deploy qilindi"
          else
            echo "⚠️  R2 binding bilan deploy bo'lmadi — binding'siz qayta deploy qilinadi"
            cp wrangler.toml.bak wrangler.toml
            wrangler deploy --env production
          fi

      # ── BIR MARTALIK BAZA TOZALASH ─────────────────────────────
      #
      # `ci/WIPE_DB_ONCE` bo'lsa: YANGI worker deploy qilingach baza
      # butunlay tozalanadi va worker QAYTA deploy qilinadi — yangi
      # izolyatlar jadvallarni yangi sxemada yaratadi. Belgi bazaga
      # yoziladi, ya'ni bir belgi bilan faqat BIR MARTA ishlaydi
      # (`ci/wipe_db.py` izohiga qarang).
      - name: Bazani tozalash (bir martalik)
        if: hashFiles('ci/WIPE_DB_ONCE') != ''
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python3 ci/wipe_db.py

      - name: Qayta deploy (tozalangan baza uchun)
        if: hashFiles('ci/WIPE_DB_ONCE') != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env production

      - name: Done
        run: echo "✅ Rust WASM Worker deployed!"
