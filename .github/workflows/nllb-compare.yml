name: NLLB solishtirish (vaqtinchalik)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Paketlar (CPU torch)
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir transformers sentencepiece protobuf
      - name: Solishtirish
        run: python3 tool/voicedub/translate_compare.py
