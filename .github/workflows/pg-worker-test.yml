name: Worker -> Ample -> Postgres sinovi (vaqtincha)

# Vaqtincha Cloudflare worker (`pgbridge-test`) joylanadi, Ample ko'prigiga so'rov yuboradi, natija chiqadi va worker O'CHIRILADI. Faqat sinov.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Ample ko'prik manzili
        required: true
      token:
        description: Ko'prik tokeni
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: secret
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: wrangler
        run: npm install -g wrangler
      - name: Joylash va sinash
        env:
          AMPLE_URL: ${{ inputs.url }}
          AMPLE_TOKEN: ${{ inputs.token }}
        run: |
          echo "::add-mask::$AMPLE_TOKEN"
          cd tool/pgtest
          wrangler deploy worker.js --name pgbridge-test --compatibility-date 2026-01-01
          printf '%s' "$AMPLE_URL" | wrangler secret put AMPLE_URL --name pgbridge-test
          printf '%s' "$AMPLE_TOKEN" | wrangler secret put AMPLE_TOKEN --name pgbridge-test
          sleep 8
          for i in 1 2 3; do
            curl -sS -m 90 https://pgbridge-test.uzcom.workers.dev/ && break
            sleep 6
          done
          echo
      - name: Workerni o'chirish
        if: always()
        run: |
          cd tool/pgtest
          wrangler delete --name pgbridge-test --force || true
