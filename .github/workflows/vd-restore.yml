name: Zaxiradan sozlamalarni qaytarish (Anibla akkaunt, adminlar)

# Noldan boshlash `app_config` dagi Anibla akkaunti (`anibla_creds`, `anibla_token`) va qo'shimcha panel bot adminlarini (`encbot_admins`)
# ham o'chirgan edi. Shularni (faqat shular) zaxiradan (run 42570947259, shifrlangan artifact) jonli bazaga qaytaradi. `ci/vd_restore.py`.

on:
  push:
    branches: [main]
    paths: ['ci/VD_RESTORE_ONCE']

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: turso-zaxira-shifrlangan
          run-id: 42570947259
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bk
      - name: Jonli baza ulanishi
        env:
          OLD_URL: ${{ secrets.TURSO_URL }}
          OLD_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          U="$OLD_URL"; T="$OLD_TOKEN"
          if [ -f tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then U="$NU"; T="$NK"; fi
          fi
          echo "::add-mask::$U"; echo "::add-mask::$T"
          echo "TURSO_URL=$U" >> "$GITHUB_ENV"; echo "TURSO_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Qaytarish
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$RUNNER_TEMP/bk/turso_backup.jsonl.gz.enc" | gunzip > "$RUNNER_TEMP/backup.jsonl"
          python3 ci/vd_restore.py "$RUNNER_TEMP/backup.jsonl"
          rm -f "$RUNNER_TEMP/backup.jsonl"
