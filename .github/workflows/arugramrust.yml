name: ARUGRAMRUST (Rust + uzcoders) — build va APK

# `ARUmultiplatform/ARUGRAMRUST/**` yoki kutubxona o'zgarganda: testlar -> armeabi-v7a -> aapt2 bilan APK (Gradle'siz) -> Telegram.
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/ARUGRAMRUST/src/**'
      - 'ARUmultiplatform/ARUGRAMRUST/assets/**'
      - 'ARUmultiplatform/ARUGRAMRUST/Cargo.toml'
      - 'ARUmultiplatform/ARUGRAMRUST/AndroidManifest.xml'
      - 'ARUmultiplatform/uzcoders/**'
      - '.github/workflows/arugramrust.yml'

permissions:
  contents: read

concurrency:
  group: arugramrust
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: secret
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/ARUGRAMRUST -> target"

      - name: Testlar (kompyuterda)
        working-directory: ARUmultiplatform/ARUGRAMRUST
        run: cargo test

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Android uchun yig'ish
        working-directory: ARUmultiplatform/ARUGRAMRUST
        run: |
          cargo ndk -t armeabi-v7a --platform 28 -o jniLibs build --release
          ls -la jniLibs/*/

      - name: APK yig'ish va imzolash (aapt2 + apksigner)
        id: apk
        working-directory: ARUmultiplatform/ARUGRAMRUST
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          "$BT/aapt2" link -o base.apk -I "$PLAT/android.jar" --manifest AndroidManifest.xml \
            --min-sdk-version 28 --target-sdk-version 34 --version-code ${{ github.run_number }}
          mkdir -p classes dex
          javac --release 8 -nowarn -encoding UTF-8 -cp "$PLAT/android.jar" -d classes $(find ../uzcoders/crates/uzcoders-android/java -name '*.java')
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 28 --lib "$PLAT/android.jar" --output dex $(find classes -name '*.class')
          (cd dex && zip -q ../base.apk classes.dex)
          mkdir -p apk/lib && cp -r jniLibs/* apk/lib/
          (cd apk && zip -q -r -0 ../base.apk lib)
          "$BT/zipalign" -p -f 4 base.apk aligned.apk
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          "$BT/apksigner" sign --ks ../../ci/release.keystore --ks-key-alias arumedia \
            --ks-pass pass:arumedia --key-pass pass:arumedia \
            --out "$OUT/arugramrust-${{ github.run_number }}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"/*.apk | head -3
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: APK'ni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" "ARUGRAMRUST build ${{ github.run_number }}"
            rm -f "$S.session"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: arugramrust-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30
