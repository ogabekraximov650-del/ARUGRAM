name: Fix GH_ACTIONS_TOKEN (worker cron 401 Bad credentials)

# UZ: Panel bot "GitHub javobi 401: Bad credentials" desa, worker'dagi GitHub tokeni (kodlash repo'sida Actions'ni ishga tushiradi) eskirgan.
#     1) GitHub'da yangi fine-grained token yarating (repo: kodlash repo'si, ruxsat: Actions = Read and write).
#     2) Uni "secret" environment'ga NEW_GH_TOKEN nomi bilan qo'shing.
#     3) Actions -> "Fix GH_ACTIONS_TOKEN" -> Run workflow (faqat qo'lda ishga tushadi).
#     Workflow tokenni tekshiradi, worker'ga `GH_ACTIONS_TOKEN`/`GH_REPO` qilib qo'yadi va `tool/encode/gh_token.enc` ni yangilaydi
#     (aks holda keyingi worker deploy eski tokenni qaytarib qo'yardi).
# EN: Replaces the expired GitHub token used by the worker cron. Run manually after adding secret NEW_GH_TOKEN to the `secret` environment.
# RU: Заменяет просроченный GitHub-токен воркера. Запускать вручную после добавления секрета NEW_GH_TOKEN в окружение `secret`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: secret
    env:
      NEW: ${{ secrets.NEW_GH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the new token
        run: |
          [ -n "$NEW" ] || { echo "::error::NEW_GH_TOKEN secret'i yo'q ('secret' environment'ga qo'shing)"; exit 1; }
          echo "::add-mask::$NEW"
          GR=$(tr -d '[:space:]' < tool/encode/gh_repo.txt)
          OWNER=$(curl -fsS -H "Authorization: Bearer $NEW" -H "User-Agent: arumediatv-fix" https://api.github.com/user \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["login"])') || { echo "::error::Token noto'g'ri yoki eskirgan (GitHub 401)"; exit 1; }
          case "$GR" in */*) REPO="$GR" ;; *) REPO="$OWNER/${GR:-avtoencode}" ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NEW" -H "User-Agent: arumediatv-fix" \
            "https://api.github.com/repos/$REPO/actions/workflows")
          [ "$code" = 200 ] || { echo "::error::Token $REPO repo'ning Actions'iga kira olmaydi (HTTP $code). Ruxsat: Actions = Read and write"; exit 1; }
          echo "OK: token akkaunti $OWNER, repo $REPO"
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Put secrets on the worker
        working-directory: worker
        run: |
          npm install -g wrangler >/dev/null 2>&1
          printf '%s' "$NEW" | wrangler secret put GH_ACTIONS_TOKEN --env production
          printf '%s' "$REPO" | wrangler secret put GH_REPO --env production
          echo "worker'ga GH_ACTIONS_TOKEN va GH_REPO ($REPO) qo'yildi"

      - name: Update tool/encode/gh_token.enc (so deploys keep the new token)
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          [ -n "$K" ] || { echo "::error::ENCODE_TOKEN yo'q"; exit 1; }
          printf '%s' "$NEW" | K="$K" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:K -out tool/encode/gh_token.enc
          BACK=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/encode/gh_token.enc | tr -d '[:space:]')
          [ "$BACK" = "$NEW" ] || { echo "::error::Shifrlash tekshiruvi o'tmadi"; exit 1; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tool/encode/gh_token.enc
          git commit -m "GH_ACTIONS_TOKEN yangilandi (gh_token.enc qayta shifrlandi)" || { echo "o'zgarish yo'q"; exit 0; }
          git push origin HEAD:main
