name: yt-dlp sinov (VAQTINCHALIK)

# Faqat bitta savol: GitHub Actions YouTube Shorts videosini yuklay oladimi? Natija jurnalda; sinovdan keyin bu fayl o'chiriladi.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ytdlp-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://www.youtube.com/shorts/KzxlZFzmM8g
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: yt-dlp o'rnatish
        run: |
          pip install -q -U "yt-dlp[default]"
          yt-dlp --version
          node --version || true
          ffmpeg -version | head -1
          echo "Runner IP:" && curl -s https://api.ipify.org && echo

      - name: Sinovlar (har bir usul alohida)
        run: |
          mkdir -p out
          ok=0
          try() {
            name="$1"; shift
            echo "::group::$name"
            rm -f out/*
            if yt-dlp --no-playlist -o "out/%(id)s.%(ext)s" "$@" "$URL"; then
              ls -l out/
              if ls out/*.mp4 out/*.webm out/*.mkv >/dev/null 2>&1; then echo "RESULT $name: OK"; ok=1; else echo "RESULT $name: FAYL YO'Q"; fi
            else
              echo "RESULT $name: XATO"
            fi
            echo "::endgroup::"
          }
          echo "== Formatlar ro'yxati =="
          yt-dlp --no-playlist -F "$URL" || echo "RESULT formatlar: XATO"
          try "oddiy" -f "bv*+ba/b" --merge-output-format mp4
          [ "$ok" = 1 ] || try "android" -f "bv*+ba/b" --merge-output-format mp4 --extractor-args "youtube:player_client=android"
          [ "$ok" = 1 ] || try "ios" -f "bv*+ba/b" --merge-output-format mp4 --extractor-args "youtube:player_client=ios"
          [ "$ok" = 1 ] || try "tv" -f "bv*+ba/b" --merge-output-format mp4 --extractor-args "youtube:player_client=tv"
          [ "$ok" = 1 ] || try "mweb" -f "bv*+ba/b" --merge-output-format mp4 --extractor-args "youtube:player_client=mweb"
          [ "$ok" = 1 ] || try "web_safari" -f "bv*+ba/b" --merge-output-format mp4 --extractor-args "youtube:player_client=web_safari"
          echo "UMUMIY NATIJA: $([ "$ok" = 1 ] && echo 'YUKLANDI' || echo 'YUKLANMADI')"
