name: yt-dlp WARP sinov (VAQTINCHALIK)

# Savol: Cloudflare WARP (IP almashtirish) bilan GitHub Actions YouTube Shorts'ni yuklay oladimi? Sinovdan keyin bu fayl o'chiriladi.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ytdlp-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://www.youtube.com/shorts/KzxlZFzmM8g
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: yt-dlp o'rnatish
        run: |
          pip install -q -U "yt-dlp[default]"
          yt-dlp --version
          echo "IP (WARP'siz): $(curl -s https://api.ipify.org)"

      - name: Sinov 1 — WARP'siz, lekin node JS runtime bilan
        continue-on-error: true
        run: |
          mkdir -p out0 && rm -f out0/*
          if yt-dlp --no-playlist --js-runtimes node -f "b" -o "out0/%(id)s.%(ext)s" "$URL"; then ls -l out0; echo "RESULT node-runtime: OK"; else echo "RESULT node-runtime: XATO"; fi

      - name: WARP o'rnatish (Cloudflare rasmiy paketi)
        id: warp
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q
          sudo apt-get install -y -q cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if warp-cli --accept-tos status | grep -qi "Connected"; then break; fi
            sleep 2
          done
          warp-cli --accept-tos status
          echo "WARP trace:"; curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp|loc)="
          echo "IP (WARP bilan): $(curl -s https://api.ipify.org)"

      - name: Sinov 2 — WARP bilan yt-dlp
        if: steps.warp.outcome == 'success'
        run: |
          ok=0
          try() {
            name="$1"; shift
            mkdir -p out && rm -f out/*
            echo "::group::$name"
            if yt-dlp --no-playlist --js-runtimes node -f "b" -o "out/%(id)s.%(ext)s" "$@" "$URL"; then
              ls -l out/
              if ls out/*.mp4 out/*.webm out/*.mkv >/dev/null 2>&1; then echo "RESULT WARP $name: OK"; ok=1; else echo "RESULT WARP $name: FAYL YO'Q"; fi
            else
              echo "RESULT WARP $name: XATO"
            fi
            echo "::endgroup::"
          }
          try "oddiy"
          [ "$ok" = 1 ] || try "tv" --extractor-args "youtube:player_client=tv"
          [ "$ok" = 1 ] || try "mweb" --extractor-args "youtube:player_client=mweb"
          [ "$ok" = 1 ] || try "ios" --extractor-args "youtube:player_client=ios"
          [ "$ok" = 1 ] || try "web_safari" --extractor-args "youtube:player_client=web_safari"
          echo "UMUMIY NATIJA (WARP): $([ "$ok" = 1 ] && echo 'YUKLANDI' || echo 'YUKLANMADI')"

      - name: Xulosa
        if: always()
        run: echo "WARP o'rnatish natijasi: ${{ steps.warp.outcome }}"
