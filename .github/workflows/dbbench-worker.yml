name: DB benchmark worker (Postgres vs libSQL on Ample)

# UZ: Vaqtinchalik test worker `arumediatv-dbbench` ni deploy qiladi va Ample'dagi Postgres / libSQL
#     javob tezligini o'lchaydi. `tool/dbbench/DELETE` fayli bo'lsa worker O'CHIRILADI.
# EN: Deploys a temporary test worker and measures Postgres vs libSQL latency on Ample.
#     If `tool/dbbench/DELETE` exists the worker is DELETED instead.
# RU: Разворачивает временный тестовый воркер и измеряет задержку Postgres и libSQL на Ample.
#     Если есть `tool/dbbench/DELETE` — воркер УДАЛЯЕТСЯ.

on:
  push:
    branches: [main]
    paths:
      - 'tool/dbbench/**'
      - '.github/workflows/dbbench-worker.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    environment: secret
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Delete test worker
        if: hashFiles('tool/dbbench/DELETE') != ''
        working-directory: tool/dbbench/worker
        run: wrangler delete --name arumediatv-dbbench --force

      - name: Deploy test worker
        if: hashFiles('tool/dbbench/DELETE') == ''
        working-directory: tool/dbbench/worker
        run: |
          wrangler deploy 2>&1 | tee /tmp/deploy.log
          grep -o 'https://[A-Za-z0-9.-]*workers.dev' /tmp/deploy.log | head -1 > /tmp/url.txt
          echo "URL=$(cat /tmp/url.txt)"

      - name: Benchmark (ping -> Postgres -> libSQL)
        if: hashFiles('tool/dbbench/DELETE') == ''
        run: |
          URL=$(cat /tmp/url.txt)
          [ -n "$URL" ] || { echo "worker URL topilmadi"; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/run?engine=ping&n=1") && [ "$code" = 200 ] && break
            sleep 4
          done
          echo "worker ready: $URL (http $code)"
          : > /tmp/res.jsonl
          run() { curl -sS -m 60 "$URL/run?engine=$1&op=$2&n=${3:-40}&seed=$4" >> /tmp/res.jsonl; echo >> /tmp/res.jsonl; }
          # warm-up (discarded)
          for e in ping pg lite; do curl -sS -m 60 "$URL/run?engine=$e&op=read&n=10&seed=0" >/dev/null; done
          # ORDER (user request): ping baseline, then Postgres, then libSQL
          for s in 1 2 3 4 5; do run ping read 40 $s; done
          for op in read write; do for s in 1 2 3 4 5; do run pg $op 40 $s; done; done
          for op in read write; do for s in 1 2 3 4 5; do run lite $op 40 $s; done; done
          python3 - <<'PY'
          import json, statistics as st
          rows = {}
          for line in open('/tmp/res.jsonl'):
              line = line.strip()
              if not line.startswith('{'): continue
              j = json.loads(line)
              k = (j['engine'], j['op'] if j['engine'] != 'ping' else '-')
              d = rows.setdefault(k, {'ms': [], 'err': 0, 'colo': j.get('colo')})
              d['ms'] += j['ms']; d['err'] += j['errors']
          def pct(a, p):
              a = sorted(a); return a[min(len(a)-1, int(len(a)*p))]
          print()
          print(f"{'engine':<6} {'op':<6} {'n':>4} {'mean':>7} {'p50':>6} {'p95':>6} {'max':>6} {'errors':>6}  (ms, Worker -> Ample -> DB -> Worker)")
          for k, d in rows.items():
              a = d['ms']
              print(f"{k[0]:<6} {k[1]:<6} {len(a):>4} {st.mean(a):>7.1f} {pct(a,.5):>6} {pct(a,.95):>6} {max(a):>6} {d['err']:>6}")
          print('colo:', next(iter(rows.values()))['colo'])
          PY
