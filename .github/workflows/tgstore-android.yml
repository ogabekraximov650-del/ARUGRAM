name: tgstore-test Android — build va testlar

# UZ: `ARUmultiplatform/tgstore/android/**` o'zgarganda: Rust yadrosi -> Kotlin testlari -> imzolangan test APK (applicationId uz.arumediatv.tgstore).
#     Yig'ish FAQAT shu yerda (mahalliy muhitga hech narsa o'rnatilmaydi). Test worker kaliti ENCODE_TOKEN'dan hosil qilinadi.
# EN: On changes to `ARUmultiplatform/tgstore/android/**`: Rust core -> Kotlin tests -> signed test APK (applicationId uz.arumediatv.tgstore).
#     Built ONLY here. The test-worker key is derived from ENCODE_TOKEN.
# RU: Pri izmenenii `ARUmultiplatform/tgstore/android/**`: yadro Rust -> testy Kotlin -> podpisannyy test-APK. Sobiraetsya TOLKO zdes.
on:
  push:
    branches: [main]
    paths:
      - 'ARUmultiplatform/tgstore/android/**'
      - 'branding/android-res/**'
      - '.github/workflows/tgstore-android.yml'

permissions:
  contents: read

concurrency:
  group: tgstore-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `APP_SIGN_SECRET` (so'rov imzosi siri) Environment secret.
    environment: secret
    defaults:
      run:
        working-directory: ARUmultiplatform/tgstore/android
    env:
      VERSION_CODE: ${{ github.run_number }}
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Rust yadrosi ──────────────────────────────────────────
      - name: Rust (stable + Android targetlari)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ARUmultiplatform/tgstore/android/rust -> target"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust yadrosini Android uchun yig'ish
        working-directory: ARUmultiplatform/tgstore/android/rust
        env:
          APP_SIGN_SECRET: ${{ secrets.APP_SIGN_SECRET }}
        run: |
          if [ -z "$APP_SIGN_SECRET" ]; then echo "⚠️  APP_SIGN_SECRET yo'q — yadro imzosiz yig'ilmoqda"; fi
          cargo ndk -t armeabi-v7a -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/*/

      # ── Brend belgilari (ilova ikonkasi) ────────────────────────
      - name: Ikonkalarni ko'chirish
        working-directory: ${{ github.workspace }}
        run: |
          RES=ARUmultiplatform/tgstore/android/app/src/main/res
          for d in branding/android-res/mipmap-*; do cp -r "$d" "$RES/"; done
          cp branding/android-res/values/ic_launcher_background.xml "$RES/values/"
          ls "$RES"

      # ── Kotlin ──────────────────────────────────────────────────
      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test worker kaliti
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          SK=$(printf '%s' "$K:tgstore" | sha256sum | cut -c1-32)
          echo "::add-mask::$SK"
          echo "TGSTORE_KEY=$SK" >> "$GITHUB_ENV"

      - name: Kotlin birlik testlari
        run: gradle --no-daemon :app:testUserDebugUnitTest

      # Hozircha 1 ta APK: Admin 32 bit (kerak bo'lsa Admin 32+64 va User 32+64 qaytariladi)
      - name: Imzolangan APK'lar (release)
        id: apk
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # Imzo kaliti: GitHub Secret bo'lsa u, aks holda repodagi `ci/release.keystore` (Flutter ilovasi bilan bir xil).
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KS_FILE="$RUNNER_TEMP/release.keystore"
          fi
          N=${{ github.run_number }}
          OUT="$RUNNER_TEMP/apks"; mkdir -p "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)

          # HOZIRCHA faqat Admin 32 bit. (Keyin qaytariladi: Admin 32+64 va User 32+64 — `git log` da oldingi variantga qarang.)
          # UZ: FAQAT admin 32 bit (armeabi-v7a). EN: admin 32-bit only (armeabi-v7a).
          # UZ: ADMIN varianti (anime/epizod yuklash uchun) — 32 bit. EN/RU: the admin flavor (32-bit).
          gradle --no-daemon :app:assembleAdminRelease -PonlyAbi=armeabi-v7a
          cp app/build/outputs/apk/admin/release/app-admin-release.apk "$OUT/tgstore-admin-32bit-$N.apk"

          for f in "$OUT"/*.apk; do
            echo "== $f"; ls -la "$f"
            "$APKSIGNER" verify --print-certs "$f" | head -3
            unzip -l "$f" | grep -E "librust_core" || true
          done
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      # ── TELEGRAM: "SAQLANGAN XABARLAR"GA YUBORISH (Flutter workflow'idagidek) ──
      # Sessiya `tool/encode/session.enc` dan (`ENCODE_TOKEN` bilan) tiklanadi, nusxada ishlanadi. Xato bo'lsa build buzilmaydi.
      # Runner'dagi standart Python 3.14 da Pyrogram import xatosi beradi (`There is no current event loop`) — 3.11 qo'yiladi.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: APK'larni Telegram "Saqlangan xabarlar"ga yuborish
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          pip install --no-cache-dir -q pyrogram==2.0.106 tgcrypto==1.2.5
          for APK in "${{ steps.apk.outputs.dir }}"/*.apk; do
            S="$RUNNER_TEMP/notify_session"
            K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K \
              -in tool/encode/session.enc -out "$S.session"
            head -c 16 "$S.session" | grep -q "SQLite format 3"
            python tool/notify/send_apk.py "$S" "$APK" \
              "TGSTORE test build ${{ github.run_number }}: $(basename "$APK")"
            rm -f "$S.session"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tgstore-test-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30
