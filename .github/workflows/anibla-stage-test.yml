name: Anibla qismlash sinovi

on:
  push:
    branches: [main]
    paths: ['tool/anibla/**', 'tool/post/**', 'tool/translate/**', 'tool/encode/test_collage.py', 'tool/encode/run.py', '.github/workflows/anibla-stage-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q cryptography
      - run: python3 tool/anibla/test_stage.py
      - run: python3 tool/encode/test_collage.py
      - run: python3 tool/post/test_ffprobe.py
      - run: python3 tool/translate/test_manual.py
      - run: |
          sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra fonts-comic-neue
          pip install -q numpy opencv-python-headless pillow pyspellchecker
          python3 tool/translate/test_render.py
          python3 tool/translate/test_each.py
          python3 tool/translate/test_classic.py
      - run: python3 -m py_compile tool/anibla/download.py tool/encode/run.py
      # Yo'qolgan funksiya/nom (NameError) ni CI'da ushlash: download.py ni import qilib, main() ishlatadigan nomlar borligini tekshiradi.
      - run: |
          pip install -q pyrogram==2.0.106 tgcrypto==1.2.5
          cd tool/anibla && python3 -c "
          import download as d
          for n in ('session_api_id','claim','process','upload_parts','upload_video_part','upload','upload_doc','main','download'):
              assert hasattr(d, n), 'yo\'q: ' + n
          print('download.py nomlari: OK')"
