name: Avtoencode repo loglarini ko'rish (diagnostika)

# `tool/diag/**` o'zgarganda: ikkinchi akkauntdagi repo'ning oxirgi run loglarini shu job logiga chiqaradi (faqat o'qish).
on:
  push:
    branches: [main]
    paths:
      - 'tool/diag/**'
      - '.github/workflows/diag-logs.yml'

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Loglarni olish
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: python3 tool/diag/fetch.py
      - name: Navbat tashxisi (worker)
        if: always()
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
        run: |
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          curl -sS -X POST -H "X-Encode-Token: $K" -H "Content-Type: application/json" -d '{}' \
            -H "User-Agent: arugram-diag" "https://arugram.uzcom.workers.dev/api/encode/qdiag" | jq '{live_keys, now, live_upload, holat_len, holat}' || true
          curl -sS -X POST -H "X-Encode-Token: $K" -H "Content-Type: application/json" -d '{}' \
            -H "User-Agent: arugram-diag" "https://arugram.uzcom.workers.dev/api/r2/diag" | jq '{binding_ok, by_state, audit}' || true
