name: Baza so'rovi (faqat o'qish)


on:
  push:
    branches: [main]
    paths: ['ci/DB_QUERY.sql', 'ci/UPLOAD_SPEED', 'ci/REPOST', 'ci/DB_RECOVER']

permissions:
  contents: read

concurrency:
  group: db-query
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # JONLI baza: worker `tool/migrate/new_turso.enc` dagi yangi bazani ishlatadi (deploy uni GitHub Secret'dan USTUN qo'yadi). Birinchi urinish
      # xato bilan ESKI (secret) bazani tozalagan edi — endi worker ishlatadigan baza tanlanadi. URL/token logda ko'rinmaydi.
      - name: Jonli baza ulanishi
        env:
          OLD_URL: ${{ secrets.TURSO_URL }}
          OLD_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          U="$OLD_URL"; T="$OLD_TOKEN"; SRC="secret"
          if [ -f tool/migrate/new_turso.enc ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            NT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/new_turso.enc 2>/dev/null || true)
            NU=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            NK=$(printf '%s' "$NT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$NU" ] && [ -n "$NK" ]; then U="$NU"; T="$NK"; SRC="new_turso.enc"; fi
          fi
          # ASOSIY ma'lumotlar AMPLE bazasida (`tool/migrate/ample.enc`, worker `db_endpoint`) — Turso'da faqat post/anibla navbatlari. Shuning uchun Ample ustun.
          if [ -f tool/migrate/ample.enc ] && [ "$(cat ci/DB_QUERY_SRC 2>/dev/null)" != "turso" ]; then
            K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
            AT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/migrate/ample.enc 2>/dev/null || true)
            AU=$(printf '%s' "$AT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])' 2>/dev/null || true)
            AK=$(printf '%s' "$AT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' 2>/dev/null || true)
            if [ -n "$AU" ] && [ -n "$AK" ]; then U="${AU%/}"; T="$AK"; SRC="ample.enc"; fi
          fi
          echo "::add-mask::$U"; echo "::add-mask::$T"
          echo "TURSO_URL=$U" >> "$GITHUB_ENV"; echo "TURSO_TOKEN=$T" >> "$GITHUB_ENV"
          echo "Baza manbasi: $SRC"
      - name: Ustunlar
        run: python3 ci/db_query.py
      # TIKLASH (faqat o'qish): baza Telegram "Database" kanalidagi shifrlangan nusxadan tiklanadi va jadvallar/qatorlar soni chiqariladi (migratsiya uchun).
      # Telegram kanaliga HECH NARSA YOZILMAYDI. `JR_KEY` GitHub Secret bo'lishi kerak. Faqat `ci/DB_RECOVER` o'zgarganda ishlaydi.
      - name: Telegram nusxasidan tiklash
        env:
          JR_KEY: ${{ secrets.JR_KEY }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q '^ci/DB_RECOVER$'; then echo "ci/DB_RECOVER o'zgarmagan — o'tkazildi"; exit 0; fi
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          # JR_KEY: GitHub Secret bo'lsa u, aks holda `tgstore/jr_key.enc` (ENCODE_TOKEN bilan shifrlangan).
          if [ -z "${JR_KEY:-}" ] && [ -f ARUmultiplatform/tgstore/jr_key.enc ]; then
            JR_KEY=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ARUmultiplatform/tgstore/jr_key.enc 2>/dev/null | tr -d '[:space:]')
          fi
          if [ -z "${JR_KEY:-}" ]; then echo "::error::JR_KEY topilmadi (secret ham, jr_key.enc ham)"; exit 1; fi
          echo "::add-mask::$JR_KEY"
          DB=$(grep -E '^CHANNEL_ID=' ARUmultiplatform/tgstore/channels.txt | head -1 | cut -d= -f2- | tr -d '[:space:]')
          echo "::add-mask::$DB"
          (cd ARUmultiplatform/ample-rs && cargo build --release 2>&1 | tail -3)
          for F in ARUmultiplatform/tgstore/bot.enc tool/bot/main_bot.enc; do
            [ -f "$F" ] || continue
            BOT=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in "$F" 2>/dev/null | tr -d '[:space:]')
            [ -n "$BOT" ] || continue
            echo "::add-mask::$BOT"
            rm -rf "$RUNNER_TEMP/jr" "$RUNNER_TEMP/dump"
            echo "Urinish: $F"
            if TG_BOT_TOKEN="$BOT" TG_CHANNEL_ID="$DB" JR_KEY="$JR_KEY" JR_DIR="$RUNNER_TEMP/jr" RECOVER_OUT="$RUNNER_TEMP/dump" \
                 ./ARUmultiplatform/ample-rs/target/release/tgstore-jr 2>&1 | tee "$RUNNER_TEMP/rec.log" | grep -v "^$" | tail -80; then
              if grep -q "jadval " "$RUNNER_TEMP/rec.log"; then echo "✅ tiklandi"; exit 0; fi
            fi
          done
          echo "::error::Telegram nusxadan tiklab bo'lmadi (yuqoridagi logga qarang)"; exit 1
      # SINOV: telefon -> worker -> Telegram yuklash tezligi (R2'siz). Faqat `ci/UPLOAD_SPEED` o'zgarganda (har safar 4 x 18 MiB x 2).
      - name: Yuklash tezligi
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^ci/UPLOAD_SPEED$'; then python3 ci/upload_speed.py; else echo "ci/UPLOAD_SPEED o'zgarmagan — o'tkazildi"; fi
      # Qismni kanalga qayta joylash: `ci/REPOST` o'zgarganda (qator: "<anime> <bo'lim> <qism>").
      - name: Qayta joylash
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^ci/REPOST$'; then python3 ci/repost.py; else echo "ci/REPOST o'zgarmagan — o'tkazildi"; fi
