name: Havola sayti (arumediatvuz.pages.dev)

# `link-web/` o'zgarsa avtomatik: qism havolalari (/s/<anime>/<bo'lim>/<qism>) sahifasi va
# Android App Links uchun `/.well-known/assetlinks.json`. Loyiha yo'q bo'lsa birinchi marta yaratiladi.
# Kerak: CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit") va CLOUDFLARE_ACCOUNT_ID (boshqa deploy'lardagi o'sha secret'lar).

on:
  push:
    branches: [main]
    paths:
      - 'link-web/**'
      - '.github/workflows/deploy-links.yml'

permissions:
  contents: read

concurrency:
  group: deploy-links
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pages loyihasi (bo'lmasa yaratiladi)
        run: |
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qw arumediatvuz; then
            echo "Loyiha bor"
          else
            npx --yes wrangler@3 pages project create arumediatvuz --production-branch main
          fi
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy link-web --project-name arumediatvuz --branch main --commit-dirty=true
