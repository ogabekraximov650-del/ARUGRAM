# UZ: BIR MARTALIK. `tool/encode/session.enc` (Pyrogram sessiyasi, ENCODE_TOKEN bilan shifrlangan) ochiladi va Ample'ning yuklash manziliga yuboriladi.
#     Sessiya hech qayerda ko'rsatilmaydi; faqat uning SHA-256 xeshi chiqadi (tekshirish uchun). Yuklash manzili 1 soat amal qiladi.
# EN: ONE-OFF. Decrypts `tool/encode/session.enc` (Pyrogram session, key ENCODE_TOKEN) and PUTs it to an Ample upload URL. Only its SHA-256 is printed.
name: Sessiyani Ample'ga yuborish (bir martalik)

on:
  workflow_dispatch:
    inputs:
      upload_url:
        description: "Ample yuklash manzili (https://api.ample.computer/u/...)"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ochish va yuborish
        env:
          ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
          UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          set -euo pipefail
          case "$UPLOAD_URL" in https://api.ample.computer/u/*) ;; *) echo "::error::Faqat Ample yuklash manzili qabul qilinadi"; exit 1;; esac
          OUT="$RUNNER_TEMP/pyro.session"
          K=$(printf '%s' "$ENCODE_TOKEN" | tr -d '[:space:]')
          K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in tool/encode/session.enc -out "$OUT"
          head -c 16 "$OUT" | grep -q "SQLite format 3" || { echo "::error::Sessiya ochilmadi (ENCODE_TOKEN boshqa?)"; exit 1; }
          echo "sessiya hajmi: $(stat -c%s "$OUT") bayt"
          echo "sha256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          curl -fsS -T "$OUT" "$UPLOAD_URL" | head -c 300; echo
          shred -u "$OUT"
