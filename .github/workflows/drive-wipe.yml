name: ARUDRIVE baza tozalash (bir martalik)

# Foydalanuvchi talabi: ARUDRIVE bazasidagi (bd_files) barcha qatorlar o'chiriladi. Faqat qo'lda ishga tushadi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wipe:
    runs-on: ubuntu-latest
    environment: secret
    steps:
      - uses: actions/checkout@v4
      - name: bd_files tozalash
        run: |
          K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
          S=$(K="$K" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in ARUmultiplatform/drive/worker/secrets.enc)
          U=$(printf '%s' "$S" | python3 -c 'import json,sys; print(json.load(sys.stdin)["BD_TURSO_URL"], end="")' | sed 's#^libsql://#https://#')
          T=$(printf '%s' "$S" | python3 -c 'import json,sys; print(json.load(sys.stdin)["BD_TURSO_TOKEN"], end="")')
          q() { curl -sS -X POST "$U/v2/pipeline" -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
                 -d "{\"requests\":[{\"type\":\"execute\",\"stmt\":{\"sql\":\"$1\"}},{\"type\":\"close\"}]}"; echo; }
          echo "Oldin:"; q "SELECT COUNT(*) FROM bd_files"
          q "DELETE FROM bd_files"
          echo "Keyin:"; q "SELECT COUNT(*) FROM bd_files"
          echo "Kesh versiyasini yangilash:"
          curl -sS -X POST "https://arudrive.uzcom.workers.dev/api/bd/bump" -H "X-Encode-Token: $K"; echo
