name: ARUDRIVE o'chirish sinovi (vaqtinchalik)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    environment: secret
    steps:
      - name: Worker orqali eng oxirgi videoni o'chirish
        run: |
          K=$(printf '%s' "${{ secrets.ENCODE_TOKEN }}" | tr -d '[:space:]')
          U=https://arudrive.uzcom.workers.dev
          lst() { curl -sS -H "X-Encode-Token: $K" "$U/api/bd/list" -o /tmp/l.json; python3 -c 'import json; f=json.load(open("/tmp/l.json"))["files"]; print("jami:",len(f)); print("birinchi 2:",[(x["id"],x["name"]) for x in f[:2]])'; }
          echo "== OLDIN"; lst
          ID=$(python3 -c 'import json; print(json.load(open("/tmp/l.json"))["files"][0]["id"])')
          echo "o'chiriladigan: $ID"
          curl -sS -X POST -H "X-Encode-Token: $K" -H 'Content-Type: application/json' -d "{\"id\":\"$ID\"}" "$U/api/bd/delete"; echo
          sleep 2
          echo "== KEYIN"; lst
