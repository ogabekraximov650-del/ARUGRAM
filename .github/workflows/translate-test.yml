name: Manga tarjima sinovi (artifact)

# `ci/testdata/*.zip` sahifalarini to'liq avto-rejimda o'tkazib (OCR -> tarjima -> chizish) natijani artifact qiladi. `ci/TRANSLATE_TEST` o'zgarsa ishlaydi
# (ichida bob nomlari: `solo_ch00 solo_ch01 ...`; bo'sh bo'lsa hammasi).

on:
  push:
    branches: [main]
    paths: ['ci/TRANSLATE_TEST']

permissions:
  contents: read

concurrency:
  group: translate-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: secret
    env:
      ENCODE_TOKEN: ${{ secrets.ENCODE_TOKEN }}
      API_BASE: ${{ secrets.API_BASE || 'https://arumediatv.uzcom.workers.dev' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Shriftlar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-dejavu-extra fonts-comic-neue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python paketlari
        run: |
          pip install --no-cache-dir -r tool/encode/requirements.txt
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r tool/translate/requirements.txt
      - name: OCR modellari keshi
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-v2
      - name: Sinov
        run: python3 ci/translate_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translate-test-out
          path: translate-test-out
          retention-days: 7
